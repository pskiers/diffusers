[tool.ruff]
line-length = 119

[tool.ruff.lint]
# Never enforce `E501` (line length violations).
ignore = ["C901", "E501", "E721", "E741", "F402", "F823"]
select = ["C", "E", "F", "I", "W"]

# Ignore import violations in all `__init__.py` files.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]
"src/diffusers/utils/dummy_*.py" = ["F401"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["diffusers"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.pytest.ini_options]
markers = [
    "v1: marks tests for the TRM v1 architecture",
    "v2: marks tests for the TRM v2 architecture",
    "v3: marks tests for the TRM v3 architecture",
    "v4: marks tests for the TRM v4 architecture",
    "v5: marks tests for the TRM v5 architecture",
    "unet: marks tests that use standard UNet models",
    "vit: marks tests that use ViT/DiT transformer models",
    "trm: marks tests that use TRM models",
    "cifar100: marks tests that use the CIFAR-100 dataset",
    "imagenet: marks tests that use the ImageNet dataset",
    "clevr: marks tests that use the CLEVR dataset",
    "standard: marks tests that use standard diffusion",
    "ratatouille: marks test that use the thinker-painter architecture",
    "mask: marks tests that use spatial mask conditioning",
    "sudoku: marks tests that use the Sudoku domain",
    "mnist_sudoku: marks tests that use the MNIST Sudoku domain",
    "mnist_sudoku_sample: marks tests that sample from models trained on the MNIST Sudoku domain",
    "mnist_sudoku_eval: marks tests that evaluate models trained on the MNIST Sudoku domain",
]
