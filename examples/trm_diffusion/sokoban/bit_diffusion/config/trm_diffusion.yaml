# --- Reproducibility ---
seed: 42

# --- Conditioning mode ---
conditioning: "unconditional"
num_classes: 0

# --- Bit-Diffusion ---
num_bits: 3
resolution: 12
ddpm_num_train_timesteps: 1000 # training noise-schedule resolution
inference_steps: 400 # denoising steps at eval/sampling
self_cond: true

# --- Carry Recycling ---
use_carry_recycling: false # during training: warm-start carry with prob carry_recycle_prob
carry_recycle_prob: 0.5 # probability of recycling vs fresh init (when enabled)
use_carry_persistence: false # during inference: persist carry across diffusion steps

# --- CFG ---
cfg_drop_rate: 0.1
guidance_scale: 4.0

# --- Asymmetric time intervals (sampling only) ---
time_shift_xi: 0.0 # offset for model timestep; 0.0 = disabled

# --- TRM Parameters ---
trm:
  n: 6 # latent recursion iterations (z-loop)
  T: 3 # T-1 no-grad + 1 with-grad
  use_grid_pos_embed: true # learnable pos embed for grid tasks (disable for natural images)

# n_sup(t) = n_min + (n_max - n_min) * sin(pi * t)
n_sup_min: 2
n_sup_max: 6

# --- Q_head (ACT — inference only) ---
q_loss_weight: 0.15 # weight of BCE(q_hat, board_accuracy) relative to MSE

# --- EMA ---
use_ema: true
ema_decay: 0.9999
ema_warmup: true
ema_inv_gamma: 1.0
ema_power: 0.75 # reaches 0.999 at ~10K steps

# --- Training ---
num_epochs: 300
batch_size: 32
num_workers: 4
lr: 1e-4
weight_decay: 1e-4
warmup_steps: 500
precision: "bf16-mixed"

# --- Evaluation ---
eval_every_n_epochs: 50
num_eval_samples: 128
save_every_n_epochs: 50

# --- W&B  ---
output_dir: "outputs/trm_bit_diffusion_sokoban"
run_name: null
wandb_project: "Sokoban-TRM-BitDiffusion"
wandb_group: null
resume_from_checkpoint: null

# --- Sampling (sample.py) ---
checkpoint_path: "best"
num_samples: 256
sample_batch_size: 64
log_to_wandb: true # log test metrics back onto the training run
wandb_run_id: null # explicit run id to resume (else read from the checkpoint dir)
wandb_entity: null # set only if the run lives under a team entity

# --- Model (Transformer2DModel backbone) ---
model:
  num_layers: 2
  patch_size: 1
  attention_head_dim: 64
  num_attention_heads: 4
  activation_fn: "gelu-approximate"
  dropout: 0.0

# --- Dataset ---
dataset:
  data_path: "/net/tscratch/people/plgmgrzanka/trm_sokoban/data/12-12-4"
  val_data_path: "/net/tscratch/people/plgmgrzanka/trm_sokoban/data/12-12-4-val"
  test_path: "/net/tscratch/people/plgmgrzanka/trm_sokoban/data/12-12-4-test"
  total_train_size: 1000 # TRM paper: small dataset + dihedral augmentation
  total_eval_size: 200
  k_values: [3, 8, 10]
  use_dihedral_aug: true # random D4 transform per __getitem__
  bot_removal_prob: 0.75 # for different amount of boxes
