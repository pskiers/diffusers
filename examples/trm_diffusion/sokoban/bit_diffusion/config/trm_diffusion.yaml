# Hydra config for TRM Bit-Diffusion (PyTorch Lightning)
#
# Usage:
#   python train_trm.py conditioning=unconditional
#   python train_trm.py conditioning=num_boxes
#   python train_trm.py conditioning=k_steps

# --- Conditioning mode ---
conditioning: "num_boxes"
num_classes: 4

# --- Bit-Diffusion ---
num_bits: 3
resolution: 12
diffusion_steps: 300
self_cond: true

# --- CFG ---
cfg_drop_rate: 0.1
guidance_scale: 4.0

# --- Asymmetric time intervals (sampling only) ---
time_shift_xi: 0.1 # ξ offset for model timestep; 0.0 = disabled

# --- TRM Parameters ---
trm:
  n: 6 # latent recursion iterations (z-loop)
  T: 3 # deep recursion depth (T-1 no-grad + 1 with-grad)
  use_grid_pos_embed: true # learnable pos embed for grid tasks; disable for natural images

# --- n_sup(t) Schedule ---
# n_sup(t) = n_min + (n_max - n_min) * sin(pi * t)
# t≈0 (clean): n_min steps | t≈0.5 (medium noise): n_max | t≈1 (noisy): n_min
n_sup_min: 2
n_sup_max: 12

# --- EMA ---
use_ema: true
ema_decay: 0.9999
ema_warmup: true
ema_inv_gamma: 1.0
ema_power: 0.75 # reaches 0.999 at ~10K steps (good for <1M total steps)

# --- Q_head (ACT — inference only) ---
# Trained on "100% correct reconstruction". Halting only at inference.
# Time-dependent threshold: threshold(t) = 0.95 - 0.4*t
q_loss_weight: 0.1 # weight of BCE(q_hat, is_correct) relative to MSE

# --- Carry Recycling ---
# Self-conditioning for hidden states (y, z) — warm-start from a no-grad forward pass
use_carry_recycling: false # during training: warm-start carry with prob carry_recycle_prob
carry_recycle_prob: 0.5 # probability of recycling vs fresh init (when enabled)
use_carry_persistence: false # during inference: persist carry across diffusion steps

# --- Training ---
num_epochs: 300
batch_size: 32
num_workers: 4
lr: 1e-4
weight_decay: 1e-5
precision: "16-mixed"

# --- Evaluation ---
eval_every_n_epochs: 50
num_eval_samples: 100
save_every_n_epochs: 50

# --- Paths ---
output_dir: "outputs/trm_bit_diffusion_sokoban"
run_name: null
resume_from_checkpoint: null

# --- Sampling (sample.py) ---
checkpoint_path: "best"
num_samples: 200
sample_batch_size: 50

# --- Model (Transformer2DModel backbone) ---
model:
  num_layers: 2
  patch_size: 1
  attention_head_dim: 32
  num_attention_heads: 2
  activation_fn: "gelu-approximate"
  dropout: 0.0

# --- Dataset ---
dataset:
  data_path: "/net/scratch/hscra/plgrid/plgmgrzanka/trm_sokoban/diffusers/examples/trm_diffusion/sokoban/data/raw/12-12-4"
  val_data_path: "/net/scratch/hscra/plgrid/plgmgrzanka/trm_sokoban/diffusers/examples/trm_diffusion/sokoban/data/raw/12-12-4-val"
  test_path: "/net/scratch/hscra/plgrid/plgmgrzanka/trm_sokoban/diffusers/examples/trm_diffusion/sokoban/data/raw/12-12-4-test"
  total_train_size: 1000 # TRM paper: small dataset + dihedral augmentation
  total_eval_size: 200
  k_values: [3, 8, 10]
  use_dihedral_aug: true # 8× D4 augmentation (rotations + flips) → effective 8000 samples
