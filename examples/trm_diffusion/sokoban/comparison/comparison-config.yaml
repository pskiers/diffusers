# @package _global_
epochs: 1000
save_model_epochs: 50
save_images_epochs: 50
train_batch_size: 64
eval_batch_size: 64
rescale_betas_zero_snr: true

n_images_to_eval: 5 # how many images to generate in one eval iteration
n_images_per_conditioning: 5 # how many images to generate in evaluation based on one conditioning board

dataset:
  train_data_dir: "/home/gosia/STUDIA/DYPLOM/reasoning-diffusion/12-12-4"
  eval_data_dir: "/home/gosia/STUDIA/DYPLOM/reasoning-diffusion/12-12-4-test"
  resolution: 12
  num_boxes: 4
  input_channels: 3
  clip_sample_range: 1.0

models:
  standard:
    unet:
      active: true
      properties:
        _target_: diffusers.UNet2DModel
        sample_size: 12
        out_channels: 3
        block_out_channels: [224, 448, 672]
        down_block_types:
          - "DownBlock2D"
          - "AttnDownBlock2D"
          - "AttnDownBlock2D"
        up_block_types:
          - "AttnUpBlock2D"
          - "AttnUpBlock2D"
          - "UpBlock2D"
        attention_head_dim: 64
        dropout: 0.1
        layers_per_block: 2
    vit:
      active: false

  trm:
    unet:
      active: true
      properties:
        _target_: trm_models.UNetTRMv2
        resolution: 12
        n: 6
        T: 3
        n_sup: 4
        core_model:
          _target_: diffusers.UNet2DModel
          sample_size: 12
          out_channels: 3
          block_out_channels: [128, 256, 384]
          down_block_types:
            - "DownBlock2D"
            - "AttnDownBlock2D"
            - "AttnDownBlock2D"
          up_block_types:
            - "AttnUpBlock2D"
            - "AttnUpBlock2D"
            - "UpBlock2D"
          attention_head_dim: 64
          dropout: 0.1
          layers_per_block: 1
    vit:
      active: false

tasks:
  uncond:
    active: true
    properties:
      model:
        in_channels: 3
      k: 0
      cfg_drop_rate: 0
      guidance_scale: 0
      concat_conditioning: false
      class_conditional: false
  cond-single-k:
    active: true
    properties:
      model:
        in_channels: 6
      k: [1, 3, 6] # in seperate trainings
      cfg_drop_rate: 0.1
      guidance_scale: 0.1
      concat_conditioning: true
      class_conditional: false
  cond-multiple-k:
    active: true
    properties:
      model:
        in_channels: 6
      k: [1, 3, 6]
      cfg_drop_rate: 0.1
      guidance_scale: 0.1
      concat_conditioning: true
      class_conditional: true
