# accelerate FSDP config — full fine-tune Janus-Pro-7B across 4x A100-40GB (Athena).
# The 7B model + AdamW (~84 GB) does NOT fit one 40 GB card; FULL_SHARD brings it to
# ~21-28 GB/GPU. CRITICAL fields for THIS trainer:
#   fsdp_use_orig_params: true   -> the optimizer is built BEFORE accelerator.prepare()
#                                   (sft.py), so FSDP must keep the original param objects.
#   fsdp_state_dict_type: FULL_STATE_DICT -> so model.save_pretrained() writes the full
#                                   (gathered) weights, not a shard.
#   SIZE_BASED_WRAP              -> no decoder-layer class name to guess (robust).
# gradient checkpointing is already enabled inside sft.py, so no FSDP activation ckpt here.
compute_environment: LOCAL_MACHINE
distributed_type: FSDP
mixed_precision: bf16
num_machines: 1
num_processes: 4
use_cpu: false
rdzv_backend: static
same_network: true
main_training_function: main
downcast_bf16: "no"
fsdp_config:
  fsdp_sharding_strategy: FULL_SHARD
  fsdp_auto_wrap_policy: SIZE_BASED_WRAP
  fsdp_min_num_params: 100000000
  fsdp_state_dict_type: FULL_STATE_DICT
  fsdp_use_orig_params: true
  fsdp_offload_params: false
  fsdp_backward_prefetch: BACKWARD_PRE
  fsdp_forward_prefetch: false
  fsdp_cpu_ram_efficient_loading: false
  fsdp_sync_module_states: true
  fsdp_activation_checkpointing: false
