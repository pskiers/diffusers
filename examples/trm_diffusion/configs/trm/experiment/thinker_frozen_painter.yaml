# @package _global_
# Thinker with frozen pretrained painter.
# Loads a StandalonePainter checkpoint, freezes bridge+UNet, trains only the thinker
# with diffusion loss only (no sudoku CE loss).
#
# Usage:
#   python train_trm.py experiment=thinker_frozen_painter \
#     painter.painter_checkpoint=runs/standalone_painter/checkpoint_final.pt

mode: "thinker_frozen_painter"
output_dir: "runs/thinker_frozen_painter"
compile: true

use_ema: true
ema_rate: 0.999

painter:
  vocab_size: 11
  bridge_channels: 16
  painter_channels: [32, 64, 64]
  painter_layers_per_block: 2
  thinker_bridge_mode: "logits"
  adapter_in_channels: 0      # 0 = use bridge's native channel count; set to N to project thinker logits to N channels and replace bridge first conv
  dtype: bfloat16
  painter_checkpoint: null   # REQUIRED: path to StandalonePainter checkpoint

train:
  lr: 1e-4
  lr_min_ratio: 0.1
  weight_decay: 1.0
  batch_size: 768
  num_steps: 50000
  warmup_steps: 2000
  eval_every: 1000
  save_every: 5000
  sudoku_loss_weight: 0.0   # no CE loss — thinker trained purely on diffusion
  mse_loss_weight: 1.0          # set to 0.0 to disable MSE loss
  eval_classifier_path: null    # path to MNISTCellClassifier checkpoint (for eval metrics)
  classifier_loss:
    weight: 0.0                 # set > 0 to enable classifier CE loss during training
    t_max: 200                  # only apply classifier loss when timestep < t_max
