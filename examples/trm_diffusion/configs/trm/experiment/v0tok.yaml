# @package _global_
# Painter-thinker (V0Tok) — original TRM thinker + diffusion painter.
# Thinker uses token input (same format as sudoku training).
# Sudoku CE loss trains the thinker; diffusion MSE trains the painter.

mode: "painter"
output_dir: "runs/trm_v0tok"

use_ema: true
ema_rate: 0.999

thinker:
  n_sup: 16
  hidden_size: 512
  puzzle_emb_ndim: 512    # disabled by default in painter mode for simplicity
  halt_exploration_prob: 0.0

painter:
  bridge_channels: 16
  painter_channels: [32, 64, 64]
  painter_layers_per_block: 2
  diff_thinker_weight: 0.0

data:
  cell_size: 16    # grid = 9*16 = 144 px

train:
  lr: 1e-4
  lr_min_ratio: 1.0
  weight_decay: 1.0
  batch_size: 384
  num_steps: 100000
  warmup_steps: 2000
  eval_every: 2000
  save_every: 10000
  sudoku_loss_weight: 1.0
  gradient_accumulation_steps: 2
