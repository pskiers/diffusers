# @package _global_
# Standalone painter: pure bridge+UNet conditioned on full solution tokens.
# No thinker. Sanity check — measures painter ceiling accuracy when given
# the perfect (ground-truth) solution as conditioning.
#
# Usage:
#   python train_trm.py experiment=standalone_painter

mode: "standalone_painter"
output_dir: "runs/standalone_painter"
compile: true

use_ema: true
ema_rate: 0.999

painter:
  vocab_size: 11              # 0=PAD,1=blank,2-10=digits; matches V0Tok thinker
  bridge_channels: 16
  painter_channels: [32, 64, 64]
  painter_layers_per_block: 2
  cfg_prob: 0.0               # set > 0 to enable classifier-free guidance dropout
  cfg_scale: 1.0              # set > 1 at eval time (or override on model) for CFG
  dtype: bfloat16

data:
  cell_size: 16

train:
  lr: 1e-4
  lr_min_ratio: 1.0
  weight_decay: 0.01
  batch_size: 384
  num_steps: 100000
  warmup_steps: 2000
  eval_every: 2000
  save_every: 10000
  gradient_accumulation_steps: 2
  sudoku_loss_weight: 0.0
  mse_loss_weight: 1.0          # set to 0.0 to disable MSE loss
  eval_classifier_path: null    # path to MNISTCellClassifier checkpoint (for eval metrics)
  classifier_loss:
    weight: 0.0                 # set > 0 to enable classifier CE loss during training
    t_max: 200                  # only apply classifier loss when timestep < t_max
