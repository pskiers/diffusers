# @package _global_
# Painter-thinker (V0Tok) with two-stage interleaved training.
#
# Each supervision tick does two sub-steps in sequence:
#   1. Painter sub-step  — thinker receives full solution tokens (teacher
#      forcing), so it trivially produces correct conditioning and the painter
#      learns to listen to it.  Only first `painter_stage.n_sup` ticks.
#   2. Thinker sub-step  — thinker receives real puzzle tokens (with blanks).
#      Painter is frozen; only CE loss flows so diffusion cannot obscure the
#      sudoku reasoning signal.  Runs every tick (up to `thinker_stage.n_sup`).
#
# Usage:
#   python train_trm.py experiment=v0tok_two_stage

mode: "painter"
output_dir: "runs/trm_v0tok_two_stage"
compile: true

use_ema: true
ema_rate: 0.999

thinker:
  n_sup: 16
  hidden_size: 512
  puzzle_emb_ndim: 512
  halt_exploration_prob: 0.0

painter:
  bridge_channels: 16
  painter_channels: [32, 64, 64]
  painter_layers_per_block: 2
  diff_thinker_weight: 0.0

data:
  cell_size: 16    # grid = 9*16 = 144 px

train:
  lr: 1e-4
  lr_min_ratio: 1.0
  weight_decay: 1.0
  batch_size: 384
  num_steps: 100000
  warmup_steps: 2000
  eval_every: 2000
  save_every: 10000
  sudoku_loss_weight: 1.0
  gradient_accumulation_steps: 2

# ── Two-stage training ────────────────────────────────────────────────────────
# Painter stage: teacher forcing with full solution tokens.
# Reduced H_cycles / L_cycles make the thinker pass cheap — the task is trivial
# (input = solution) so deep recursion adds no benefit and just slows things down.
painter_stage:
  n_sup: 4         # painter sub-steps per batch (≤ thinker_stage.n_sup)
  H_cycles: 1      # outer recursion depth during painter stage
  L_cycles: 2      # inner iterations per H-cycle during painter stage

# Thinker stage: real puzzle tokens, painter frozen, CE loss only.
thinker_stage:
  n_sup: 16        # thinker sub-steps per batch (matches thinker.n_sup)
