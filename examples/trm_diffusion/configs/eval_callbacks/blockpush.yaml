# Closed-loop BlockPush eval: mean score + p1/p2 success rates over
# n_eval_episodes rollouts, n_envs stepped together per model call (see
# models/dp_eval_callbacks.py's VectorizedObsBuffer/_chunk_sizes).
# normalizer is left null here and attached at runtime from the fitted
# train_dataset normalizer (see train_trm.py).
- _target_: models.dp_eval_callbacks.BlockPushEvalCallback
  normalizer: null
  n_eval_episodes: 128
  max_steps: 350
  n_obs_steps: ${data.n_obs_steps}
  n_action_steps: ${data.n_action_steps}
  n_envs: 32
