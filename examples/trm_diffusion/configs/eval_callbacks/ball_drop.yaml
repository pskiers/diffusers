# Ball Drop eval callback: best-of-10 DDIM sampling + line extraction/
# physics re-simulation (no learned classifier needed). No ratio/optimality
# dimension (unlike Steiner/Polygon) — this is a reachability/success task,
# see eval/ball_drop_eval.py. extra_eval_sets adds the real
# loganbolton/sketchvlm-physics-ball-drop benchmark (198 instances, imported
# via datasets/ball_drop_real_data.py — genuine external generalization
# check, not just a synthetic OOD split). If a training run's periodic eval
# is too slow, lower num_samples/num_candidates here (and/or the extra set's
# own num_samples) — see BallDropEvalCallback's docstring for the cost
# tradeoff.
- _target_: models.eval_callbacks.BallDropEvalCallback
  image_size: ${data.image_size}
  num_samples: 256
  num_candidates: 10
  num_log_images: 8
  extra_eval_sets:
    - name: real_sketchvlm
      hf_filename: val_real_sketchvlm.ndjson
      num_samples: 198
