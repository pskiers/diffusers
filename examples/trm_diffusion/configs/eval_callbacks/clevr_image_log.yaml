- _target_: eval.clevr_eval_callbacks.ClevrImageLogCallback
  root_dir: "${data.clevr_root}"
  mode: "${data.mode}"
  n_scenes: 16
  min_objects: 3
  max_objects: 8
  reveal_n_objects: ${data.reveal_n_objects}
  reveal_radius_frac: ${data.reveal_radius_frac}
  include_centroid_mask: ${data.include_centroid_mask}
  centroid_mask_presence_only: ${data.centroid_mask_presence_only}
  image_size: ${data.image_size}
