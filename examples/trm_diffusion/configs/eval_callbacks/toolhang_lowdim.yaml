# Closed-loop ToolHang eval with camera obs disabled (use_camera_obs=false),
# for ToolHangLowdimDataset-trained painters.
- _target_: models.dp_eval_callbacks.ToolHangEvalCallback
  normalizer: null
  n_eval_episodes: 50
  max_steps: 700
  n_obs_steps: ${data.n_obs_steps}
  n_action_steps: ${data.n_action_steps}
  use_camera_obs: false
