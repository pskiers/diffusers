# Polygon eval callback: best-of-10 DDIM sampling (matching the paper's own
# evaluation protocol, arXiv 2510.21697 Table 3) + edge-existence/validity
# checks (no learned classifier needed). Also breaks down on the OOD 13-15
# point-range generalization split, on top of the in-distribution 7-12
# primary set — same trained model, no retraining needed. If a training
# run's periodic eval is too slow, lower num_samples/num_candidates here
# (and/or extra_eval_sets' own num_samples) — see PolygonEvalCallback's
# docstring for the cost tradeoff.
- _target_: models.eval_callbacks.PolygonEvalCallback
  image_size: ${data.image_size}
  num_samples: 256
  num_candidates: 10
  num_log_images: 8
  extra_eval_sets:
    - name: pts13_15
      hf_filename: val_13_15.ndjson
      max_points: 15
      num_samples: 128
