# Closed-loop PushT eval using the vendored 9-keypoint PushTKeypointsEnv
# (third_party/pusht_keypoints/), for PushTLowdimDataset-trained painters.
- _target_: models.dp_eval_callbacks.PushTImageEvalCallback
  normalizer: null
  n_eval_episodes: 128
  max_steps: 300
  n_obs_steps: ${data.n_obs_steps}
  n_action_steps: ${data.n_action_steps}
  n_envs: 32
  obs_type: keypoints
