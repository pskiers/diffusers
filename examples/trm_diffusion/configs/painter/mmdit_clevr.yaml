# Trainable MM-DiT painter for CLEVR (stage 1): MiniT2I's architecture
# (models/mmdit_painter.py) scaled down, in pixel space like MiniT2I (no VAE).
# 256x256 RGB in 16-pixel patches -> 16x16 image tokens; the scene's objects are
# the condition stream, one token each (missing objects -> mask token), no RoPE.
_target_: models.mmdit_painter.MMDiTPainter
_recursive_: false
net:
  image_size: ${data.image_size}
  patch_size: 16
  in_channels: 3
  hidden_size: 512
  depth: 12
  preamble_depth: 1
  num_heads: 8
  head_dim: 64
  mlp_ratio: 2.6667
  pca_channels: 128
  time_cond: false            # adaLN-Zero timestep conditioning (MiniT2I has none)
  norm: "rms"                  # "layer": LayerNorm everywhere (DiT) instead of RMSNorm
  qk_norm: true                # false: no RMSNorm on q and k (DiT)
  patch_embed: "bottleneck"    # "plain": one conv straight to the width (DiT)
  zero_init_output: true       # false: keep the output layer's xavier init
  mlp: "swiglu"                # "gelu": DiT's MLP (4x, tanh-GELU, biases)
  rope: true                   # false: no rotary embeddings (sin/cos positions only, DiT)
cond_tokenizer:
  _target_: models.mmdit_painter.EmbeddingCondTokenizer
  in_dim: ${data.object_feat_dim}
steer_from_block: 6          # read after block 6, steer blocks 6-11
steer_to_block: null         # steer only blocks [steer_from_block, steer_to_block); null = to the last
painter_dtype: "bfloat16"
pixel_range: "[-1,1]"
model_range: "[-1,1]"        # range the model works in; "[0,1]" as the working puzzle painters
t_logit_mean: -0.8
t_logit_std: 0.8
label_drop_rate: 0.1
objective: "flow"            # "ddpm": DDPM x0-prediction training (with diffusion=ddpm)
time_cond_scale: 1000        # t * this into the timestep embedding: 1000 for flow t, 1 for DDPM steps
train_t_max: null            # ddpm only: train on timesteps [0, train_t_max] (e.g. a thinker stage kept off the noisiest steps)
loss_weighting: "velocity"   # "x0": train on the x0 MSE (velocity MSE x (1 - t)^2)
freeze: false
checkpoint: null
eval_callbacks: ${eval_callbacks}
optim_cfg:
  _target_: configs.schemas.PainterOptimConfig
  lr: 1e-4
  weight_decay: 0.0
  warmup_steps: 2000
  lr_min_ratio: 0.1
