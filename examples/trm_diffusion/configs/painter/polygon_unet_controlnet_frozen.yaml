# Frozen UNetPainter for ControlNet thinker steering — stage 2.
# Loads a trained polygon_unet_painter checkpoint and freezes the UNet.
_target_: models.painter_base.ControlNetSteeredUNetPainter
_recursive_: false
checkpoint: ???  # REQUIRED: path to polygon_unet_painter checkpoint
unet: ${backbone}
painter_dtype: null
pixel_range: "[-1,1]"
optim_cfg:
  _target_: configs.schemas.PainterOptimConfig
  lr: 3e-5
  weight_decay: 0.0
  warmup_steps: 1000
  lr_min_ratio: 0.1
