# Trainable, conditional Polygon UNetPainter (channel-concat conditioning,
# unscaled/paper-size backbone) — stage 1. Kept for a "faithful to the
# paper" comparison point; see polygon_unet_concat_small.yaml for the
# scaled-down variant used day to day. Trained with CFG dropout
# (train.cfg_prob, see configs/train/polygon.yaml) so it can also be sampled
# unconditionally.
_target_: models.painter_base.ConcatConditionedUNetPainter
_recursive_: false
unet: ${backbone}
image_channels: 1
painter_dtype: null
pixel_range: "[-1,1]"
eval_callbacks: ${eval_callbacks}
optim_cfg:
  _target_: configs.schemas.PainterOptimConfig
  lr: 1e-4
  weight_decay: 0.01
  warmup_steps: 2000
  lr_min_ratio: 1.0
