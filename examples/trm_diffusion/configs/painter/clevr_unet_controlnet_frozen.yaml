# Frozen CLEVR UNetPainter for ControlNet thinker steering (stage-2).
# checkpoint must be set as a command-line override.
# The painter-side condition encoder is hardcoded here (must match the trained
# clevr_unet_painter checkpoint) so that /condition_encoder group overrides in
# the experiment refer only to the thinker's condition encoder.
_target_: models.painter_base.ControlNetSteeredUNetPainter
_recursive_: false
checkpoint: ???         # REQUIRED: path to clevr_unet_painter checkpoint
unet: ${backbone}
vae: ${vae}
condition_encoder:
  _target_: models.condition_encoders.ObjectFeatureEncoder
  in_dim: ${data.object_feat_dim}
  hidden_dim: ${backbone.cross_attention_dim}
  out_dim: ${backbone.cross_attention_dim}
  with_timestep_emb: false
painter_dtype: null
optim_cfg:
  _target_: configs.schemas.PainterOptimConfig
  lr: 3e-5
  weight_decay: 0.0
  warmup_steps: 1000
  lr_min_ratio: 0.1
