# Frozen ActionTransformerPainter for IP-Adapter thinker steering — image
# obs variant (pusht_hybrid).
# Loads a trained {task}_transformer_painter checkpoint, freezes the backbone,
# and wraps each decoder layer with a trainable, index-matched IP block —
# only the thinker, translator, and these small IP blocks train.
# The condition_encoder here is inlined (not a swappable group): it must
# exactly match whatever the checkpoint being loaded was trained with.
_target_: models.action_painters.IPAdapterSteeredActionTransformerPainter
_recursive_: false
checkpoint: ???  # REQUIRED: path to the base {task}_transformer_painter checkpoint
backbone: ${backbone}
action_dim: ${data.action_dim}
horizon: ${data.horizon}
condition_encoder:
  _target_: models.condition_encoders.ImageObsConditionEncoder
  n_obs_steps: ${data.n_obs_steps}
  use_group_norm: true
  pretrained: false
  crop_shape: [76, 76]
optim_cfg:
  _target_: configs.schemas.PainterOptimConfig
  lr: 3e-5
  weight_decay: 0.0
  warmup_steps: 1000
  lr_min_ratio: 0.1
