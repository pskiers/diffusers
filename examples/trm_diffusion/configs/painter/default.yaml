bridge_channels: 16
painter_channels: [32, 64, 64]
painter_layers_per_block: 2
diff_thinker_weight: 1.0
thinker_bridge_mode: "logits"

# Image-encoder size (V0/V1 only)
enc_channels: 32
enc_hidden_channels: [16, 32]
thinker_out_channels: null

# Timestep conditioning (V1 only)
enc_timestep_cond: false
thinker_timestep_cond: false
decoder_timestep_cond: false
temb_dim: 256

optim:
  lr: 1e-4
  lr_min_ratio: 1.0
  weight_decay: 0.01
  warmup_steps: 2000