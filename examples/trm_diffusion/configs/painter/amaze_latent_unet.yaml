# Trainable latent-space Amaze UNetPainter (unconditional), stage 1 of the latent
# painter-thinker. Images are encoded by the frozen pretrained VAE (${vae}) and
# the diffusion runs on the latents.
_target_: models.painter_base.UNetPainter
_recursive_: false
unet: ${backbone}
vae: ${vae}
# AmazeDataset delivers [0,1]; the SD VAE expects [-1,1] -> rescaled inside encode().
data_pixel_range: "[0,1]"
# Per-channel latent normalisation z = (E(x) - shift) / scale. null = SD's global
# scaling_factor. slurm_scripts/train_amaze/train_latent_painter_thinker.sh fills
# these from experiments/amaze_vae_ceiling.py's measured train-latent statistics.
latent_shift: null
latent_scale: null
painter_dtype: bfloat16
eval_callbacks: ${eval_callbacks}
optim_cfg:
  _target_: configs.schemas.PainterOptimConfig
  lr: 1e-4
  weight_decay: 0.01
  warmup_steps: 2000
  lr_min_ratio: 1.0
