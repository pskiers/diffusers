# Frozen latent-space Amaze UNetPainter for ControlNet thinker steering.
# Must be built exactly like the stage-1 painter (configs/painter/amaze_latent_unet.yaml),
# including the SAME latent_shift/latent_scale overrides — they are config, not
# checkpoint state.
_target_: models.painter_base.ControlNetSteeredUNetPainter
_recursive_: false
checkpoint: ???  # REQUIRED: path to an amaze_latent_unet_painter checkpoint
unet: ${backbone}
vae: ${vae}
data_pixel_range: "[0,1]"
latent_shift: null
latent_scale: null
painter_dtype: bfloat16
# Optimizer for the NON-frozen parts: the cross-attention condition encoder and the
# ControlNet translator (the whole steering path). Was copied from the pixel controlnet
# config (AdamW 3e-5, cosine to 3e-6), which starved the freshly initialised
# cross-attention -- it trained at 1/3..1/30 of the TRM's rate, with AdamW updates
# further damped by the tiny (/global_batch_size*K) gradients. Now matched to the
# thinker: AdamATan2 (scale-invariant), constant 1e-4.
optim_cfg:
  _target_: configs.schemas.PainterOptimConfig
  lr: 1e-4
  weight_decay: 0.0
  warmup_steps: 2000
  lr_min_ratio: 1.0
  betas: [0.9, 0.95]
  use_adam_atan2: true
