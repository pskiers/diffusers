# Inscribed Square TRM.
# seq_len = (image_size/grid_factor)^2 = (128/16)^2 = 64 spatial tokens from
# the condition-encoder CNN (see squares_spatial_v0.yaml) — a fixed spatial
# grid over the curve raster, same shape as Steiner/Polygon's grid (this
# architecture is otherwise generic/task-independent, see thinker/steiner.yaml).
_target_: models.trm_wrappers.SpatialTRM
vocab_size: 16        # placeholder internal width; consumed by the ControlNet translator, not a class vocabulary
seq_len: 64
hidden_size: 512
n_heads: 8
L_layers: 2
L_cycles: 6
H_cycles: 3
n_sup: 16
expansion: 4.0
forward_dtype: "bfloat16"
pos_encodings: "rope"
mlp_t: false
puzzle_emb_ndim: 0
puzzle_emb_len: 0
num_puzzle_identifiers: 1
halt_exploration_prob: 0.0
freeze_weights: false
batch_size: 256

optim_cfg:
  _target_: configs.schemas.ThinkerOptimConfig
  lr: 1e-4
  weight_decay: 1.0
  beta1: 0.9
  beta2: 0.95
  warmup_steps: 2000
  lr_min_ratio: 1.0
  puzzle_emb:
    _target_: configs.schemas.PuzzleEmbOptimConfig
    lr: 1e-4
    weight_decay: 1.0
    warmup_steps: 2000
    lr_min_ratio: 1.0
with_timestep_emb: false
with_halt_head: false