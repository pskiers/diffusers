# Sudoku TRM training config
# Override any value on the command line, e.g.:
#   python train_sudoku.py data_dir=data/sudoku-extreme-1k model.d_model=512

data_dir: "data/sudoku-extreme-1k"
output_dir: "runs/sudoku_trm"
num_workers: 4
mixed_precision: "bf16"  # bfloat16 halves activation memory; use "no" only for debugging
resume_from_checkpoint: null   # path to a checkpoint_*.pt file to resume from

wandb_project: small-llm-diffusion    # set to a project name to enable wandb logging, e.g. "sudoku-trm"
wandb_run_name: null   # optional run name (auto-generated by wandb if null)

model:
  vocab_size: 11    # 0=PAD, 1=blank, 2-10=digits 1-9
  seq_len: 81       # 9x9 grid
  d_model: 512      # reference uses 512; 256 is 4× fewer params in attn/mlp
  n_heads: 8        # reference uses 8 (hidden_size // 64)
  n_layers: 2       # transformer layers per block call (L_layers in original TRM)
  L_cycles: 6       # inner iterations per H-cycle  (≡ n in diffusion TRM)
  H_cycles: 3       # macroscopic cycles             (≡ T in diffusion TRM)
  n_sup: 16         # supervision steps; reference uses ACT halt_max_steps=16
  dropout: 0.0
  num_puzzle_ids: null  # set to a positive int to enable puzzle-identifier embeddings

train:
  lr: 1e-4
  weight_decay: 1.0    # reference uses 1.0; 0.1 allows too much memorization
  batch_size: 256
  num_steps: 50000
  warmup_steps: 2000
  eval_every: 1000
  save_every: 5000
  log_every: 100
