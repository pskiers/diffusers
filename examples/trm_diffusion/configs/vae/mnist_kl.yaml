# Custom-trained KL-VAE for MNIST Sudoku (144×144 → 36×36×4).
# Architecture must match the model in configs/vae_config.yaml.
_target_: models.utility_models.load_frozen_custom_kl_vae
checkpoint_path: "runs/vae/checkpoint_step-4000.pt"
in_channels: 1
out_channels: 1
down_block_types: ["DownEncoderBlock2D", "DownEncoderBlock2D", "DownEncoderBlock2D"]
up_block_types: ["UpDecoderBlock2D", "UpDecoderBlock2D", "UpDecoderBlock2D"]
block_out_channels: [32, 64, 128]
layers_per_block: 2
latent_channels: 4
norm_num_groups: 32
act_fn: "silu"
