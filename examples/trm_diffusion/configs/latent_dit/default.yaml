vae_checkpoint: null    # REQUIRED: path to runs/vae/checkpoint_final.pt

# ── VAE architecture ──────────────────────────────────────────────────────────
# Used to reconstruct the AutoencoderKL when loading from a .pt state-dict.
# Must match the architecture that was used in train_vae.py.
# Note: in/out_channels are the PIXEL-SPACE channels (1 = grayscale).
#       latent_channels is the dimensionality of the VAE bottleneck (the space the DiT works in).
#       The DownEncoderBlock2D / UpDecoderBlock2D are the VAE's convolutional blocks
#       that do the 144→36 spatial compression — nothing to do with the DiT.
vae_arch:
  in_channels: 1           # pixel-space input channels (grayscale)
  out_channels: 1          # pixel-space output channels
  latent_channels: 4       # VAE bottleneck channels = DiT input channels
  down_block_types:
    - "DownEncoderBlock2D"
    - "DownEncoderBlock2D"
  up_block_types:
    - "UpDecoderBlock2D"
    - "UpDecoderBlock2D"
  block_out_channels:
    - 64
    - 128
  layers_per_block: 2
  norm_num_groups: 32
  act_fn: "silu"

# ── DiT backbone (Transformer2DModel) ─────────────────────────────────────────
# Pure stack of transformer blocks — no down/upsampling inside the DiT itself.
# The only spatial op is the initial patch embedding (patchify) and the final
# unpatchify at the output.
latent_channels: 4         # must match vae_arch.latent_channels
latent_size: 36            # spatial size of the latent (painter_size 144 / 4x VAE downsampling)
patch_size: 4              # 36 / 4 = 9×9 = 81 patches → one patch per sudoku cell

num_attention_heads: 8
attention_head_dim: 64     # hidden_size = 8 * 64 = 512
num_layers: 6              # number of transformer blocks
mlp_ratio: 4.0
dropout: 0.0

# ── Conditioning ──────────────────────────────────────────────────────────────
vocab_size: 11             # 0=null/CFG-dropout, 1=blank cell, 2-10=given digits 1-9
cond_embed_dim: 256        # ConditionEncoder output dim (projected to hidden_size inside DiT)

optim:
  lr: 1e-4
  weight_decay: 0.0
  warmup_steps: 1000
  lr_min_ratio: 0.1
