defaults:
  - dataset: cifar100
  - model: unet2d
  - _self_
  - experiment: null

# 1. Core Paths & Logging
output_dir: "ddpm-model-64"
logging_dir: "logs"
logger: "wandb"
cache_dir: "cache_dir"
push_to_hub: false
hub_model_id: null
hub_token: null

# 2. Dataloading & Batching
train_batch_size: 64
eval_batch_size: 64
dataloader_num_workers: 0
epoch_max_batches_train: 1000
epoch_max_batches_eval: 250

# 3. Training Hyperparameters
num_epochs: 10000
learning_rate: 1e-4
lr_scheduler: "cosine"
lr_warmup_steps: 500
gradient_accumulation_steps: 1
mixed_precision: "fp16"
adam_beta1: 0.95
adam_beta2: 0.999
adam_weight_decay: 1e-6
adam_epsilon: 1e-08
enable_xformers_memory_efficient_attention: false

# 4. Diffusion & CFG Settings
prediction_type: "epsilon"
ddpm_num_steps: 1000
ddpm_num_inference_steps: 1000
ddpm_beta_schedule: "linear"
cfg_drop_rate: 0.1
guidance_scale: 4.0

# 5. EMA Settings
use_ema: true
ema_inv_gamma: 1.0
ema_power: 0.75
ema_max_decay: 0.9999

# 6. Saving & Checkpointing
save_images_epochs: 5
save_model_epochs: 5
checkpointing_steps: 1000
checkpoints_total_limit: null
resume_from_checkpoint: null

# 7. "Small Loop" Base Settings
use_small_loop: false
T: 3
n: 6
N_supervision: 4

# 8. Sampling Settings
checkpoint_step: "latest"
checkpoint_path: null
num_samples: 10000
sample_batch_size: 64
vae_batch_size: 64
use_ddim: false
