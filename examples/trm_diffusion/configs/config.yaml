# Base config for train_trm.py.
# Select an experiment with: experiment=sudoku  or  experiment=v0tok
#
# Usage:
#   python train_trm.py experiment=sudoku
#   python train_trm.py experiment=v0tok
#   accelerate launch --num_processes=2 train_trm.py experiment=sudoku

defaults:
  - _self_
  - thinker: default
  - painter: default
  - latent_dit: default
  - data: mnist_sudoku
  - diffusion: ddpm
  - train: default
  - eval: default
  - experiment: null

mode: "sudoku"            # "sudoku" | "painter" | "standalone_painter" | ...
painter_variant: "v0tok"  # "v0tok" | "v0" | "v1" | "v2" | "v3" | "v4"

run:
  output_dir: "runs/trm"
  resume_from_checkpoint: null
  wandb_project: small-llm-diffusion

ema:
  enabled: true
  rate: 0.999

precision:
  mixed_precision: "no"   # accelerate AMP ("no" | "fp16" | "bf16")
  thinker_dtype: bfloat16 # TRM forward dtype (CastedEmbedding / forward pass)
  painter_dtype: bfloat16 # bridge + UNet forward dtype
