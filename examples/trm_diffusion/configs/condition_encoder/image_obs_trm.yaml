# Thinker-facing condition encoder for image action-sequence tasks (pusht_hybrid,
# toolhang_image) — separate from the frozen painter's own baked-in image_obs
# encoder. Wraps ImageObsConditionEncoder's output as a TRMInput for the
# thinker to reason over.
_target_: models.condition_encoders.ImageObsTRMConditionEncoder
n_obs_steps: ${data.n_obs_steps}
use_group_norm: true
pretrained: false
crop_shape: [76, 76]
