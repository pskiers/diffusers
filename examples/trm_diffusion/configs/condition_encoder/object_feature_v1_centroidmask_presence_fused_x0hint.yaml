# Same as object_feature_v1_centroidmask_fused_x0hint.yaml, but mask_channels:1
# instead of 16 — pair with data.centroid_mask_presence_only=true, which makes
# CLEVRHybridDataset build a single-channel presence-only mask (WHERE objects
# are, nothing else, not even size — see make_presence_mask_from_scene) instead
# of the full per-attribute mask. Isolates pure positional information from
# object identity. seq_len stays 266 (10 objects + 256 combined tokens) —
# identical token layout to object_feature_v1_x0hint.yaml, so
# translator=controlnet_clevr_v1_sliced and thinker.seq_len=266 need no changes.
_target_: models.condition_encoders.X0PredHintConditionEncoder
threshold: 90  # match whatever you've settled on for object_feature_v1_x0hint
inner:
  _target_: models.condition_encoders.ObjectFeatureEncoderV1CentroidMaskFused
  in_dim: ${data.object_feat_dim}
  hidden_dim: ${thinker.hidden_size}
  out_dim: ${thinker.hidden_size}
  latent_channels: 4
  hidden_size: ${thinker.hidden_size}
  grid_size: 16
  mask_channels: 1
  noisy_dropout_p_max: 0.0
  num_train_timesteps: ${diffusion.num_train_timesteps}
  with_timestep_emb: true
