# Thinker-side condition encoder: spatial image CNN (V0, no noisy input),
# same pattern as Maze/Sudoku's spatial_image_v0/maze_spatial_v0 — reads the
# points-only condition image and keeps pixel-spatial correspondence, rather
# than CLEVR's permutation-invariant per-object token set.
_target_: models.condition_encoders.SpatialConditionEncoder
in_channels: 1
enc_channels: 128
hidden_channels: [128, 256, 256]
output_dim: ${thinker.hidden_size}
factor: ${data.grid_factor}
with_timestep_emb: true
