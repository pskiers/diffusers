# Channel-concat variant: the reveal image is resized to the noisy latent's
# resolution and concatenated channel-wise with it (both derived from the
# same real scene, genuinely co-registered — see
# ObjectFeatureEncoderV1RevealFused), then run through ONE combined CNN.
# seq_len stays 266 (10 objects + 256 combined tokens) — identical token
# layout to object_feature_v1_x0hint.yaml, so translator=
# controlnet_clevr_v1_sliced and thinker.seq_len=266 need no changes at all.
_target_: models.condition_encoders.X0PredHintConditionEncoder
threshold: 90  # match whatever you've settled on for object_feature_v1_x0hint
inner:
  _target_: models.condition_encoders.ObjectFeatureEncoderV1RevealFused
  in_dim: ${data.object_feat_dim}
  hidden_dim: ${thinker.hidden_size}
  out_dim: ${thinker.hidden_size}
  latent_channels: 4
  hidden_size: ${thinker.hidden_size}
  grid_size: 16
  reveal_channels: 3
  noisy_dropout_p_max: 0.0
  num_train_timesteps: ${diffusion.num_train_timesteps}
  with_timestep_emb: true
