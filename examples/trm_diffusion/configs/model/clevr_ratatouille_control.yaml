_target_: trm_models.RatatouilleUNetControl
resolution: 32
downsample_factor: 2
n: 6
T: 3
n_sup: 4

core_model:
  _target_: diffusers.UNet2DConditionModel
  sample_size: 32
  in_channels: 4
  out_channels: 4
  layers_per_block: 2
  block_out_channels: [256, 512, 1024]
  down_block_types: ["DownBlock2D", "AttnDownBlock2D", "DownBlock2D"]
  up_block_types: ["UpBlock2D", "AttnUpBlock2D", "UpBlock2D"]
  cross_attention_dim: 1

thinker_model:
  _target_: models.UnifiedConditionUNet
  condition_mode: "sequence"
  raw_dim: 55
  sample_size: 16
  in_channels: 128
  out_channels: 128
  layers_per_block: 1
  block_out_channels: [128, 128]
  down_block_types: ["CrossAttnDownBlock2D", "DownBlock2D"]
  up_block_types: ["UpBlock2D", "CrossAttnUpBlock2D"]
  cross_attention_dim: 512
