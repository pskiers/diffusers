_target_: trm_models.RatatouilleDiTConcat
resolution: 32
downsample_factor: 2
n: 6
T: 3
n_sup: 4

core_model:
  _target_: models.UnifiedConditionDiT # Massive Painter
  condition_mode: "class_adaln"
  num_classes: 100
  sample_size: 32
  in_channels: 67 # 3 (noise) + 64 (Remy dim)
  out_channels: 3
  num_layers: 12
  patch_size: 2
  attention_head_dim: 64 # 384 hidden / 6 heads
  num_attention_heads: 6
  activation_fn: "gelu-approximate"

thinker_model:
  _target_: models.UnifiedConditionDiT # Tiny Thinker
  condition_mode: "class"
  num_classes: 100
  sample_size: 16
  in_channels: 64
  out_channels: 64
  num_layers: 2
  patch_size: 2
  attention_head_dim: 64
  num_attention_heads: 6
  cross_attention_dim: 256
  activation_fn: "gelu-approximate"