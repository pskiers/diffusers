# Unscaled/paper-size concat-conditioned backbone: the paper's actual
# reported architecture (4 levels, base_channels=64, attention at 3 of 4
# levels — ~63M params), condition channel-concatenated before the UNet.
# Kept as the "faithful to the paper" comparison point; see
# polygon_unet_concat_small.yaml for the scaled-down variant used day to day.
_target_: diffusers.UNet2DModel
sample_size: 128
in_channels: 2
out_channels: 1
block_out_channels: [64, 128, 256, 512]
down_block_types:
  - "DownBlock2D"
  - "AttnDownBlock2D"
  - "AttnDownBlock2D"
  - "AttnDownBlock2D"
up_block_types:
  - "AttnUpBlock2D"
  - "AttnUpBlock2D"
  - "AttnUpBlock2D"
  - "UpBlock2D"
norm_num_groups: 32
layers_per_block: 2
