# Approximates the paper's custom UNet (4 levels, base_channels=64,
# self-attention at the deeper levels) using diffusers.UNet2DModel.
_target_: diffusers.UNet2DModel
sample_size: 128
in_channels: 1
out_channels: 1
block_out_channels: [64, 128, 256, 512]
down_block_types:
  - "DownBlock2D"
  - "AttnDownBlock2D"
  - "AttnDownBlock2D"
  - "AttnDownBlock2D"
up_block_types:
  - "AttnUpBlock2D"
  - "AttnUpBlock2D"
  - "AttnUpBlock2D"
  - "UpBlock2D"
norm_num_groups: 32
layers_per_block: 2
