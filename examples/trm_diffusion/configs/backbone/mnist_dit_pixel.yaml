# Pixel-space Transformer2DModel for MNIST Sudoku (no VAE/latents).
# patch_size == data.cell_size, so sample_size/patch_size = 9 -> the DiT's
# 9x9=81 patches align 1:1 with the sudoku grid's cells, in pixel space.
_target_: diffusers.Transformer2DModel
num_attention_heads: 8
attention_head_dim: 64       # inner_dim = 8*64 = 512
in_channels: 1
out_channels: 1
num_layers: 3
sample_size: 144             # data.painter_size
patch_size: 16                # data.cell_size -> 144/16 = 9
norm_type: "ada_norm_single"
attention_bias: true
activation_fn: "gelu-approximate"
