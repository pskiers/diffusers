# Same as clevr_unet.yaml, but in_channels includes the centroid-mask
# channels channel-concatenated onto x_noisy (see
# models.painter_base.ConcatCrossAttnConditionedUNetPainter). Default here
# assumes the 1-channel presence-only mask (data.centroid_mask_presence_only=
# true); for the full 16-channel mask, override in_channels to 20.
_target_: diffusers.UNet2DConditionModel
sample_size: 32
in_channels: 5  # 4 latent + 1 presence-mask channel
out_channels: 4
cross_attention_dim: 512
block_out_channels: [128, 256, 256]
down_block_types:
  - "CrossAttnDownBlock2D"
  - "CrossAttnDownBlock2D"
  - "CrossAttnDownBlock2D"
up_block_types:
  - "CrossAttnUpBlock2D"
  - "CrossAttnUpBlock2D"
  - "CrossAttnUpBlock2D"
layers_per_block: 2
