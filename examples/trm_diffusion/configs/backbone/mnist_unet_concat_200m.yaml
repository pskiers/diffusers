# Conditional MNIST-Sudoku UNet, ~200M params -- a bigger sibling of
# mnist_unet_concat_big.yaml (81.7M), for parameter-count ablations. Same
# 4-level/channel-concat/2-attention-level shape, wider channels plus
# layers_per_block=3 for extra depth. Measured: 220.7M params. Expect
# noticeably more memory/compute per step than the 81.7M version (see the
# earlier bs=16/fp32/uncompiled benchmark: params roughly track compute for
# this family) -- may need a smaller train.batch_size to fit, depending on
# GPU memory.
_target_: diffusers.UNet2DModel
sample_size: 144
in_channels: 2   # 1 noisy image + 1 given-cells condition (channel-concat)
out_channels: 1
block_out_channels: [128, 256, 512, 768]
down_block_types:
  - "DownBlock2D"
  - "DownBlock2D"
  - "AttnDownBlock2D"
  - "AttnDownBlock2D"
up_block_types:
  - "AttnUpBlock2D"
  - "AttnUpBlock2D"
  - "UpBlock2D"
  - "UpBlock2D"
norm_num_groups: 32
layers_per_block: 3
