# Unconditional Polygon backbone — same size/shape as the scaled-down
# Steiner/MNIST-Sudoku backbone (mnist_unet.yaml): 3 plain levels, no
# attention. See configs/backbone/polygon_unet_concat.yaml for the
# unscaled/paper-size variant, kept only as a conditional comparison point.
_target_: diffusers.UNet2DModel
sample_size: 128
in_channels: 1
out_channels: 1
block_out_channels: [32, 64, 64]
down_block_types:
  - "DownBlock2D"
  - "DownBlock2D"
  - "DownBlock2D"
up_block_types:
  - "UpBlock2D"
  - "UpBlock2D"
  - "UpBlock2D"
norm_num_groups: 32
layers_per_block: 2
