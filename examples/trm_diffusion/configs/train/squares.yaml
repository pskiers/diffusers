seed: 42
compile: true

batch_size: 512
num_steps: 24400
gradient_accumulation_steps: 8  # 512*8=4096 effective batch, matching the paper's 128/GPU*4GPUs*8accum
cfg_prob: 0.0  # paper's released checkpoint is always-conditional, no CFG dropout (p_null=0)

noisy_swap:
  prob: 0.0
  t_min: 80
  t_max: 100