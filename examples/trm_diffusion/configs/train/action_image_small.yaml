# Training hyperparams for smaller-image action-sequence tasks (pusht_hybrid,
# 96x96 single view). Smaller batch than the lowdim tasks — the ResNet18
# vision encoder is the memory bottleneck, not the action backbone.
seed: 42
compile: true

batch_size: 64
num_steps: 200000
gradient_accumulation_steps: 1
# Runs from before train_steps backpropped the true mean loss had gradients
# 1/batch_size smaller; grad_clip = batch_size reproduces their clipping.
grad_clip: 64.0
cfg_prob: 0.0
