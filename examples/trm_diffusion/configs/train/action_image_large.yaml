# Training hyperparams for larger-image action-sequence tasks (toolhang_image,
# 240x240 x 2 camera views). Smaller batch again than pusht_hybrid.
seed: 42
compile: true

batch_size: 32
num_steps: 300000
gradient_accumulation_steps: 2
# Runs from before train_steps backpropped the true mean loss had gradients
# 1/batch_size smaller; grad_clip = batch_size reproduces their clipping.
grad_clip: 32.0
cfg_prob: 0.0
