image_size: 128
node_radius: 2
edge_width: 1
fill_polygon: true
max_points: 12          # matches datasets/polygon_generation.py's default --max-points
grid_factor: 16         # thinker/condition-encoder spatial downsampling factor
num_workers: 4
hf_repo: "pskiers/trm-diffusion-max-area-polygon"  # private; generated by datasets/polygon_generation.py

# Downloads from hf_repo by default (ndjson_path: null) — works on a fresh
# machine with no local data/ directory. Override
# train_dataset.ndjson_path/val_dataset.ndjson_path to point at a local file
# instead (e.g. right after running polygon_generation.py yourself).
train_dataset:
  _target_: datasets.polygon_dataset.PolygonDataset
  ndjson_path: null
  hf_repo: "${data.hf_repo}"
  hf_filename: "train.ndjson"
  image_size: "${data.image_size}"
  node_radius: "${data.node_radius}"
  edge_width: "${data.edge_width}"
  fill_polygon: "${data.fill_polygon}"
  max_points: "${data.max_points}"

val_dataset:
  _target_: datasets.polygon_dataset.PolygonDataset
  ndjson_path: null
  hf_repo: "${data.hf_repo}"
  hf_filename: "val.ndjson"
  image_size: "${data.image_size}"
  node_radius: "${data.node_radius}"
  edge_width: "${data.edge_width}"
  fill_polygon: "${data.fill_polygon}"
  max_points: "${data.max_points}"
