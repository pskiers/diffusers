image_size: 128
line_width: 2
structure_width: 2
grid_factor: 16       # thinker/condition-encoder spatial downsampling factor
num_workers: 4
hf_repo: "pskiers/trm-diffusion-ball-drop"  # private; generated by datasets/ball_drop_generation.py

# Downloads from hf_repo by default (ndjson_path: null) — works on a fresh
# machine with no local data/ directory. Override train_dataset.ndjson_path/
# val_dataset.ndjson_path to point at a local file instead (e.g. right after
# running ball_drop_generation.py yourself).
train_dataset:
  _target_: datasets.ball_drop_dataset.BallDropDataset
  ndjson_path: null
  hf_repo: "${data.hf_repo}"
  hf_filename: "train.ndjson"
  image_size: "${data.image_size}"
  line_width: "${data.line_width}"
  structure_width: "${data.structure_width}"

val_dataset:
  _target_: datasets.ball_drop_dataset.BallDropDataset
  ndjson_path: null
  hf_repo: "${data.hf_repo}"
  hf_filename: "val.ndjson"
  image_size: "${data.image_size}"
  line_width: "${data.line_width}"
  structure_width: "${data.structure_width}"
