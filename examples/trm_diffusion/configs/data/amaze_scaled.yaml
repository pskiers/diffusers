# Amaze with SCALED/TRANSLATED targets (datasets.amaze_dataset.AmazeScaledDataset):
# the solved puzzle is shrunk to a random [scale_min, scale_max] of its size and pasted
# at a random offset on a plain canvas; the condition stays untransformed, so condition
# and target positions no longer correspond. The Amaze counterpart of mnist_sudoku_scaled.
# Pair with eval_callbacks=amaze_queens_scaled (crop-back before scoring).
#
# Amaze data. The parquets come from scripts/gen_amaze.py — see
# configs/data/amaze_generation.yaml for how they are built.
#
# amaze_root selects the task directory: data/amaze/maze or data/amaze/queens.
# It is mandatory on purpose — a default would silently train a queens run on maze
# data. Task-specific experiments pin it; task-agnostic ones (thinker, painter) take
# it from the caller.
# image_size selects which precomputed train parquet is loaded, so it must be one
# of amaze_generation.yaml's scaled_image_sizes.
amaze_root: ???
image_size: 144
painter_size: 144
cell_size: 20
num_workers: 4
num_channels: 3
scale_min: 0.8
scale_max: 0.9
# Must not occur along the puzzle's own border: black for queens (dark-grey board
# frame); mazes have a black background and need a different colour.
canvas_color: [0.0, 0.0, 0.0]
transform_condition: false   # true = aligned control (same transform on the condition)

train_dataset:
  _target_: datasets.amaze_dataset.AmazeScaledDataset
  # Already resized to image_size and stripped to the columns training reads.
  dataset_path: "${data.amaze_root}/maze_dataset_train_${data.image_size}.parquet"
  split: "train"   # ignored — dataset_path points at a file
  image_size: "${data.image_size}"
  condition_field: "m_original_img"
  target_field: "sol_img"
  num_channels: "${data.num_channels}"
  include_metadata: false
  scale_min: "${data.scale_min}"
  scale_max: "${data.scale_max}"
  canvas_color: "${data.canvas_color}"
  transform_condition: "${data.transform_condition}"

val_dataset:
  _target_: datasets.amaze_dataset.AmazeScaledDataset
  # Native resolution with every column: the eval callbacks score against
  # cell_map + metadata, which the train parquets do not carry.
  dataset_path: "${data.amaze_root}/maze_dataset_test.parquet"
  split: "test"    # ignored — dataset_path points at a file
  image_size: "${data.image_size}"
  condition_field: "m_original_img"
  target_field: "sol_img"
  num_channels: "${data.num_channels}"
  include_metadata: true # eval callbacks need the GT reference images
  scale_min: "${data.scale_min}"
  scale_max: "${data.scale_max}"
  canvas_color: "${data.canvas_color}"
  transform_condition: "${data.transform_condition}"
