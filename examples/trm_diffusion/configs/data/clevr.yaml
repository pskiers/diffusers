clevr_root: "data/clevr"
mode: "relative"          # "absolute" | "relative" | "reduced"
image_size: 256
num_workers: 4
n_reduced_samples: 16     # per-scene pre-computed reduced samples (mode=reduced only)

# These are read by factory.py to configure the CLEVR DiT
object_feat_dim: 55       # 55 for relative/reduced, 21 for absolute
max_objects: 10

# Diagnostic switches — both default off (original behavior). Mutually
# exclusive (both populate spatial_conditions). Pair reveal_n_objects>0 with
# condition_encoder=object_feature_v1_reveal, include_centroid_mask=true
# with condition_encoder=object_feature_v1_centroidmask.
reveal_n_objects: 0        # if >0, reveal a real-image crop around this many objects' true positions
reveal_radius_frac: 0.12
include_centroid_mask: false
# If include_centroid_mask=true: presence-only mask (1 channel, WHERE objects
# are and nothing else — not even size, every blob uses the same fixed sigma)
# vs. the default full mask (16 channels, WHERE + color/shape/material/size).
# Pair with condition_encoder=object_feature_v1_centroidmask_presence_fused_x0hint
# (mask_channels: 1) instead of the *_centroidmask_fused_x0hint config.
centroid_mask_presence_only: false

train_dataset:
  _target_: datasets.clevr_dataset.CLEVRHybridDataset
  root_dir: "${data.clevr_root}"
  split: "train"
  mode: "${data.mode}"
  image_size: "${data.image_size}"
  n_reduced_samples: "${data.n_reduced_samples}"
  reveal_n_objects: "${data.reveal_n_objects}"
  reveal_radius_frac: "${data.reveal_radius_frac}"
  include_centroid_mask: "${data.include_centroid_mask}"
  centroid_mask_presence_only: "${data.centroid_mask_presence_only}"

val_dataset:
  _target_: datasets.clevr_dataset.CLEVRHybridDataset
  root_dir: "${data.clevr_root}"
  split: "validation"
  mode: "${data.mode}"
  image_size: "${data.image_size}"
  n_reduced_samples: "${data.n_reduced_samples}"
  reveal_n_objects: "${data.reveal_n_objects}"
  reveal_radius_frac: "${data.reveal_radius_frac}"
  include_centroid_mask: "${data.include_centroid_mask}"
  centroid_mask_presence_only: "${data.centroid_mask_presence_only}"
