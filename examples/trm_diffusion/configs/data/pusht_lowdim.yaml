# PushT low-dimensional dataset — state observations, 2D continuous actions
# Following Diffusion Policy paper (Chi et al. 2023): horizon=16, n_obs_steps=2, n_action_steps=8
# Download: python -c "from datasets.pusht_dataset import download_pusht; download_pusht()"

train_dataset:
  _target_: datasets.pusht_dataset.PushTLowdimDataset
  zarr_path: data/pusht/pusht_cchi_v7_replay.zarr
  split: train
  horizon: ${data.horizon}
  pad_before: 1
  pad_after: 7
  val_ratio: 0.02
  seed: 42
  download: true

val_dataset:
  _target_: datasets.pusht_dataset.PushTLowdimDataset
  zarr_path: data/pusht/pusht_cchi_v7_replay.zarr
  split: val
  horizon: ${data.horizon}
  pad_before: 1
  pad_after: 7
  val_ratio: 0.02
  seed: 42
  download: true

# Policy temporal structure (from paper)
horizon: 16
n_obs_steps: 2
n_action_steps: 8
action_dim: 2
obs_dim: 20  # 2D agent_pos + 18D T-block keypoints; 2 if keypoints not in zarr

# painter_size: not applicable for lowdim
num_workers: 4
