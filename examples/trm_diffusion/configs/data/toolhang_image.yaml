# ToolHang image dataset — two camera views (sideview + robot0_eye_in_hand,
# kept as separate views, not channel-concatenated) plus 9D robot proprioception.
# From robomimic tool_hang/ph — professional human demos
# Download: python -c "from datasets.toolhang_dataset import download_tool_hang; download_tool_hang(variant='image')"

train_dataset:
  _target_: datasets.toolhang_dataset.ToolHangImageDataset
  hdf5_path: data/robomimic/datasets/tool_hang/ph/image.hdf5
  horizon: ${data.horizon}
  pad_before: 1
  pad_after: 7
  val_ratio: 0.02
  seed: 42
  download: true
  split: train

val_dataset:
  _target_: datasets.toolhang_dataset.ToolHangImageDataset
  hdf5_path: data/robomimic/datasets/tool_hang/ph/image.hdf5
  horizon: ${data.horizon}
  pad_before: 1
  pad_after: 7
  val_ratio: 0.02
  seed: 42
  download: true
  split: val

horizon: 16
n_obs_steps: 2
n_action_steps: 8
action_dim: 7
obs_image_shape: [2, 3, 240, 240]  # two views (sideview, hand), each 3x240x240, kept separate
obs_dim: 9   # robot proprioception (eef_pos 3 + eef_quat 4 + gripper 2)
num_workers: 2   # large images
