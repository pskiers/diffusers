# Alternative Steiner training data spanning the paper's full evaluated
# point-range (10-50), not just its narrow training range (10-20). Adds
# freshly-generated instances for 21-30/31-40/41-50 (250k each, via
# datasets/steiner_generation.py) on top of the paper's own 1M 10-20
# instances, concatenated into train_full_range.ndjson (1.75M total,
# globally-unique instance_ids). Does NOT touch validation: val_dataset
# below is identical to steiner.yaml's, and eval_callbacks/steiner.yaml's
# extra_eval_sets (the actual 21-30/31-40/41-50 OOD reporting data) are a
# completely separate, untouched held-out set — this file only changes what
# the model is *trained* on.
#
# Use via `data=steiner_full_range` instead of `data=steiner`.
image_size: 128
node_radius: 2
edge_width: 2
max_points: 50          # must cover the widest range now in the training pool (41-50)
grid_factor: 16         # thinker/condition-encoder spatial downsampling factor
num_workers: 4
hf_repo: "pskiers/trm-diffusion-steiner-tree"  # private; generated by datasets/steiner_generation.py

train_dataset:
  _target_: datasets.steiner_dataset.SteinerTreeDataset
  ndjson_path: null
  hf_repo: "${data.hf_repo}"
  hf_filename: "train_full_range.ndjson"
  image_size: "${data.image_size}"
  node_radius: "${data.node_radius}"
  edge_width: "${data.edge_width}"
  max_points: "${data.max_points}"

val_dataset:
  _target_: datasets.steiner_dataset.SteinerTreeDataset
  ndjson_path: null
  hf_repo: "${data.hf_repo}"
  hf_filename: "val.ndjson"  # unchanged from steiner.yaml -- same in-distribution (10-20) val set
  image_size: "${data.image_size}"
  node_radius: "${data.node_radius}"
  edge_width: "${data.edge_width}"
  max_points: "${data.max_points}"
