# Data config for the SRM paper MNIST Sudoku dataset.
#
# Uses sudokus.npy + top_5000_values.csv from the SRM GitHub release to
# replicate the exact puzzle set and MNIST digit pool from the paper.
# Missing files are downloaded automatically on first use.
#
# Training range (0, 80) = all difficulties, matching the paper config.
# For evaluation the model sees the test split (last 10 000 puzzles).

cell_size: 16          # 16×16 cells → 144×144 grid (consistent with this repo)

train_dataset:
  _target_: datasets.mnist_sudoku_srm_dataset.MNISTSudokuSRMDataset
  root_dir: data/mnist_sudoku_srm
  split: train
  top_n: 1000
  test_samples_num: 10000
  given_cells_range: [0, 80]
  cell_size: ${data.cell_size}
  seed: 0
  download: true

val_dataset:
  _target_: datasets.mnist_sudoku_srm_dataset.MNISTSudokuSRMDataset
  root_dir: data/mnist_sudoku_srm
  split: test
  top_n: 1000
  test_samples_num: 10000
  given_cells_range: [17, 65]   # evaluation: at least 17 given cells (meaningful puzzles)
  cell_size: ${data.cell_size}
  seed: 0
  download: true

painter_size: 144
num_workers: 4
vocab_size: 11         # 0=PAD, 1=blank, 2-10=digits 1-9
