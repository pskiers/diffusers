# ToolHang low-dimensional dataset (53D state, 7D action)
# From robomimic tool_hang/ph — professional human demos
# Download: python -c "from datasets.toolhang_dataset import download_tool_hang; download_tool_hang(variant='lowdim')"

train_dataset:
  _target_: datasets.toolhang_dataset.ToolHangLowdimDataset
  hdf5_path: data/robomimic/datasets/tool_hang/ph/low_dim.hdf5
  horizon: ${data.horizon}
  pad_before: 1
  pad_after: 7
  val_ratio: 0.02
  seed: 42
  download: true
  split: train

val_dataset:
  _target_: datasets.toolhang_dataset.ToolHangLowdimDataset
  hdf5_path: data/robomimic/datasets/tool_hang/ph/low_dim.hdf5
  horizon: ${data.horizon}
  pad_before: 1
  pad_after: 7
  val_ratio: 0.02
  seed: 42
  download: true
  split: val

horizon: 16
n_obs_steps: 2
n_action_steps: 8
action_dim: 7
obs_dim: 53  # object 44D + robot 9D (object-first, matches upstream obs_keys order); 9D if object obs not available
num_workers: 4
