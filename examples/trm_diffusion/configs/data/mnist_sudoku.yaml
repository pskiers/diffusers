sudoku_dir: "data/sudoku-extreme-1k-aug-1000"
mnist_root: "data/mnist"
cell_size: 16
painter_size: 144  # cell_size(16) * 9 = 144
num_workers: 4
vocab_size: 11   # 0=PAD, 1=blank, 2-10=digits 1-9
num_givens: null  # if set, randomly keep only this many given cells per puzzle

train_dataset:
  _target_: datasets.mnist_sudoku_dataset.MNISTSudokuDataset
  sudoku_dir: "${data.sudoku_dir}/train"
  mnist_root: "${data.mnist_root}"
  cell_size: "${data.cell_size}"
  mnist_split: "train"
  mask_given: true
  num_givens: "${data.num_givens}"

val_dataset:
  _target_: datasets.mnist_sudoku_dataset.MNISTSudokuDataset
  sudoku_dir: "${data.sudoku_dir}/test"
  mnist_root: "${data.mnist_root}"
  cell_size: "${data.cell_size}"
  mnist_split: "test"
  mask_given: true
  num_givens: "${data.num_givens}"
