image_size: 128
curve_thickness: 1   # matches config_curves.yaml's curve_kwargs.thickness_range=[1]
square_thickness: 1  # matches config_curves.yaml's square_kwargs.thickness=1
fill_square: true    # matches config_curves.yaml's fill_square=true
num_workers: 4
hf_repo: "pskiers/trm-diffusion-inscribed-square"  # private; generated by datasets/squares_generation.py

# Downloads from hf_repo by default (ndjson_path: null) — works on a fresh
# machine with no local data/ directory. Override train_dataset.ndjson_path/
# val_dataset.ndjson_path to point at a local file instead (e.g. right after
# running squares_generation.py yourself).
train_dataset:
  _target_: datasets.squares_dataset.SquaresDataset
  ndjson_path: null
  hf_repo: "${data.hf_repo}"
  hf_filename: "train.ndjson"
  image_size: "${data.image_size}"
  curve_thickness: "${data.curve_thickness}"
  square_thickness: "${data.square_thickness}"
  fill_square: "${data.fill_square}"

val_dataset:
  _target_: datasets.squares_dataset.SquaresDataset
  ndjson_path: null
  hf_repo: "${data.hf_repo}"
  hf_filename: "val.ndjson"
  image_size: "${data.image_size}"
  curve_thickness: "${data.curve_thickness}"
  square_thickness: "${data.square_thickness}"
  fill_square: "${data.fill_square}"
