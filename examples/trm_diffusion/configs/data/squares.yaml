image_size: 128
curve_thickness: 1   # matches config_curves.yaml's curve_kwargs.thickness_range=[1]
square_thickness: 1  # matches config_curves.yaml's square_kwargs.thickness=1
fill_square: true    # matches config_curves.yaml's fill_square=true
num_workers: 4
hf_repo: "pskiers/trm-diffusion-inscribed-square"  # private; the paper authors' own
                                                     # real curves_data.zip (100k pairs),
                                                     # repackaged verbatim — see
                                                     # SquaresImagePairDataset's docstring.
                                                     # datasets/squares_generation.py (our
                                                     # own numpy port of their generator)
                                                     # is still available as a fallback via
                                                     # SquaresDataset, not used by default.

# Downloads+extracts curves_data.zip from hf_repo by default (image_dir: null)
# — works on a fresh machine with no local data/ directory. No pre-split
# train/val files exist in the source data, so the split is done by
# instance-id range instead (last 2% held out for val, matching Steiner/
# Polygon's ~2k-sample val set convention at this data's scale).
train_dataset:
  _target_: datasets.squares_dataset.SquaresImagePairDataset
  image_dir: null
  hf_repo: "${data.hf_repo}"
  hf_filename: "curves_data.zip"
  image_size: "${data.image_size}"
  fill_square: "${data.fill_square}"
  id_range: [0, 98000]

val_dataset:
  _target_: datasets.squares_dataset.SquaresImagePairDataset
  image_dir: null
  hf_repo: "${data.hf_repo}"
  hf_filename: "curves_data.zip"
  image_size: "${data.image_size}"
  fill_square: "${data.fill_square}"
  id_range: [98000, 100000]
