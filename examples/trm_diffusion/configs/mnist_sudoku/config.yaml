# Base config for MNIST Sudoku Ratatouille training.
# Select a model variant with: experiment=v0  (or v1, v2, v3, v4)

defaults:
  - _self_
  - experiment: null   # override with: experiment=v0

data:
  sudoku_dir: "data/sudoku-extreme-1k-aug-1000"
  mnist_root: "data/mnist"
  cell_size: 16          # pixel side of each digit cell; grid = 9*cell_size = 144

output_dir: "runs/mnist_sudoku"   # overridden by each experiment/*.yaml

num_workers: 4
gradient_accumulation_steps: 1
resume_from_checkpoint: null
mixed_precision: "bf16"

wandb_project: small-llm-diffusion

use_ema: true
ema_decay: 0.9999
num_timesteps: 1000
beta_schedule: "squaredcos_cap_v2"
prediction_type: "epsilon"   # "epsilon" (noise) or "sample" (x0 prediction)

# ── Offline sampling (sample_mnist_sudoku.py) ──────────────────────────────────
sample:
  checkpoint_path: null
  num_samples: 16
  batch_size: 8
  num_steps: 100
  use_ddim: false
  condition_source: "blank"

# ── Training ──────────────────────────────────────────────────────────────────
train:
  lr: 1e-4
  weight_decay: 1.0
  batch_size: 128
  num_steps: 100000
  warmup_steps: 2000
  eval_every: 2000
  save_every: 10000
  log_every: 100
  sudoku_loss_weight: 0.0

  # Classifier-based digit evaluation during training.
  # Set eval_classifier_path to enable; classifier is trained automatically if absent.
  eval_classifier_path: null    # path to save/load the MNIST cell classifier
  eval_num_ddim_steps: 20       # DDIM steps used for eval sampling
  eval_num_samples: 128         # total samples to generate for digit eval
  eval_batch_size: 32           # DDIM sampling batch size (affects VRAM during eval)
  eval_num_log_images: 10       # max images to log as wandb panels

model:
  variant: "v0"    # one of v0..v4
  kwargs: {}       # model-specific overrides (see experiment configs)
