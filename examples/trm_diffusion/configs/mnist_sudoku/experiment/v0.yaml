# @package _global_
output_dir: "runs/mnist_sudoku_v0"

model:
  variant: "v0"
  kwargs:
    # Thinker: match working SudokuTRM hyperparams
    d_model: 512
    n_heads: 8
    n_layers: 2
    L_cycles: 6
    H_cycles: 3
    n_sup: 16
    num_puzzle_ids: 1000   # one embedding per puzzle (dataset has ~1000 puzzles)
    diff_thinker_weight: 0.0   # 0=TRM trained only on sudoku_loss; 1.0=full diff gradient
    # Encoder / bridge / painter
    enc_channels: 64
    bridge_channels: 16
    painter_channels: [64, 128, 256]

train:
  sudoku_loss_weight: 1.0
