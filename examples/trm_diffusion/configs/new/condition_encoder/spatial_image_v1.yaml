# Thinker-side condition encoder: spatial image CNN concatenated with noisy input (V1).
_target_: models.condition_encoders.NoisySpatialConditionEncoder
in_channels: 2          # 1 condition + 1 noisy
enc_channels: 128
hidden_channels: [128, 256, 256]
output_dim: ${thinker.hidden_size}
factor: ${data.cell_size}
noisy_dropout_p_max: 0.7
num_train_timesteps: ${diffusion.num_train_timesteps}
with_timestep_emb: true
