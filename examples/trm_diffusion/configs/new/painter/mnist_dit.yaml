# Latent DiTPainter for MNIST Sudoku (unconditional, no condition_encoder).
_target_: models.painter_base.DiTPainter
dit: ${backbone}
vae: ${vae}
painter_dtype: null
eval_callbacks: ${eval_callbacks}
optim_cfg:
  _target_: configs.schemas.PainterOptimConfig
  lr: 1e-4
  weight_decay: 0.0
  warmup_steps: 2000
  lr_min_ratio: 0.1
