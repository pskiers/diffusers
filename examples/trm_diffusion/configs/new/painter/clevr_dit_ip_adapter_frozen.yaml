# Frozen CLEVR DiTPainter with per-block IP-Adapter conditioning (stage-2).
# checkpoint must be set as a command-line override.
_target_: models.painter_base.IPAdapterSteeredDiTPainter
_recursive_: false
checkpoint: ???         # REQUIRED: path to DiTPainter checkpoint
painter_dtype: "bfloat16"
dit: ${backbone}
vae: ${vae}
condition_encoder: ${condition_encoder}
optim_cfg:
  _target_: configs.schemas.PainterOptimConfig
  lr: 3e-5
  weight_decay: 0.0
  warmup_steps: 1000
  lr_min_ratio: 0.1
