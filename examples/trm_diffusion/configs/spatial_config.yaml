run:
  output_dir: "runs/spatial_latent"
  resume_from_checkpoint: null
  wandb_project: small-llm-diffusion

data:
  sudoku_dir: "data/sudoku-extreme-1k-aug-1000"
  mnist_root: "data/mnist"
  cell_size: 16
  num_workers: 4

# ── VAE ───────────────────────────────────────────────────────────────────────
# Same architecture used in train_vae.py — must match the checkpoint.
vae:
  checkpoint: null     # REQUIRED: e.g. runs/vae/checkpoint_final.pt
  in_channels: 1
  out_channels: 1
  latent_channels: 4
  down_block_types:
    - "DownEncoderBlock2D"
    - "DownEncoderBlock2D"
    - "DownEncoderBlock2D"
  up_block_types:
    - "UpDecoderBlock2D"
    - "UpDecoderBlock2D"
    - "UpDecoderBlock2D"
  block_out_channels:
    - 32
    - 64
    - 128
  layers_per_block: 2
  norm_num_groups: 32
  act_fn: "silu"

# ── Model ─────────────────────────────────────────────────────────────────────
model:
  model_type: "unet"   # "unet" | "dit"
  latent_channels: 4
  latent_size: 36

  down_block_types:
    - "DownBlock2D"
    - "CrossAttnDownBlock2D"
  up_block_types:
    - "CrossAttnUpBlock2D"
    - "UpBlock2D"
  block_out_channels:
    - 64
    - 128
  layers_per_block: 2
  attention_head_dim: 8
  norm_num_groups: 16

  vocab_size: 11
  cond_embed_dim: 256

  # Spatial noise
  f_spatial: 0.25       # 1/4 of latent size → grid_h=9 ≈ one blob per cell
  tau_init: 20.0        # timestep spread for initial Perlin field
  tau_student: 30.0     # timestep spread for Path B structured field
  n_octaves: 1

  # Path B schedule (starts all Path A, ramps up to p_refine_max)
  p_refine_max: 0.7
  p_refine_warmup_steps: 20000

  teacher_ema_rate: 0.999

  # ── DiT backbone (model_type: "dit") ────────────────────────────────────────
  # attention_head_dim is shared with UNet (above). Default is 8 for UNet;
  # override to 64 when using DiT: model.attention_head_dim=64
  patch_size: 4              # 36/4=9x9=81 patches — one per sudoku cell
  n_heads: 8
  n_layers: 6
  mlp_ratio: 4.0
  t_freq_dim: 256            # sinusoidal embedding channels before MLP

  # Timestep mode: "discrete" uses integer T_field + alphas_cumprod table lookup.
  #               "continuous" keeps T_field as float and uses the analytical
  #               squaredcos_cap_v2 formula — smoother spatial noise gradients.
  continuous_time: false

  # ── Noise mode ───────────────────────────────────────────────────────────
  # "perlin"         — original Path A/B with Perlin T_field from step 0
  # "teacher_guided" — Stage 1 (uniform) then Stage 2 (teacher + roulette)
  noise_mode: "perlin"

  # teacher_guided: Stage 1 warm-up length (uniform scalar timestep only)
  stage1_steps: 5000

  # Augmentation roulette probabilities (must sum to 1.0)
  aug_prob_vanilla: 0.20
  aug_prob_power: 0.30
  aug_prob_threshold: 0.30
  aug_prob_perlin: 0.20

  # Power (trajectory simulation): progress ~ U(progress_min, progress_max)
  progress_min: 0.1
  progress_max: 0.9
  # Teacher evaluation min timestep fraction for power & threshold augmentations
  teacher_t_min_frac: 0.6

  # Thresholding: n split points ~ randint(n_min, n_max),
  #   each drawn from U(val_min, val_max) → quantise to n+1 levels
  threshold_n_min: 1
  threshold_n_max: 4

  cell_size: 16
  painter_size: 144

# ── Optimiser ─────────────────────────────────────────────────────────────────
optim:
  lr: 1e-4
  weight_decay: 0.0
  warmup_steps: 1000
  lr_min_ratio: 0.1

# ── Training loop ─────────────────────────────────────────────────────────────
train:
  seed: 0
  batch_size: 128
  num_steps: 150000
  gradient_accumulation_steps: 1
  cfg_prob: 0.1
  compile: false

# ── Evaluation ────────────────────────────────────────────────────────────────
eval:
  batch_size: 256      # smaller than train to avoid OOM across 3 eval passes + T-field viz
  eval_every: 2000
  save_every: 10000
  log_every: 100
  num_ddim_steps: 30
  num_samples: 512
  cfg_scale: 2.0
  num_log_images: 8
  classifier_path: runs/mnist_classifier_cell16.pt
  # Confidence-driven denoising controls (spatial sampling loop only)
  guidance_alpha: 1.0   # overall speed scale; 0 = uniform DDIM, 1 = default
  guidance_power: 1.0   # exponent on confidence; >1 sharpens differences, <1 flattens
  guidance_top_m: null  # only denoise top-m fraction of most-confident pixels (null = all)

precision:
  mixed_precision: "no"
