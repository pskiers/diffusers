# Thinker's image-grid outputs -> one zero-initialized residual per steered
# MMDiTPainter block; steer_cond: also the condition-stream outputs -> residuals
# on the condition tokens (models/translators.py).
_target_: models.translators.PainterResidualTranslator
in_dim: ${thinker.vocab_size}
painter_dim: ${painter.net.hidden_size}
grid: ???          # thinker's image grid: condition_encoder.img_grid / pool
painter_grid: ???  # painter.net.image_size / painter.net.patch_size
num_blocks: ???    # painter.net.depth - painter.steer_from_block
steer_cond: false
hidden_dim: null          # set: shared Linear -> per-block to_v -> zero-init to_out (the DiT-direct IP construction)
with_timestep_emb: false  # add a timestep embedding to the tokens before the per-block projections
timestep_scale: 1000      # t * this into that embedding: 1000 for flow t in [0, 1], 1 for DDPM steps
input_noise_std: 0.0      # training only: Gaussian noise on the tokens after the bridge, so faint cues don't suffice
block_keep_prob: 1.0      # training only: keep each block's residual with this probability, per sample
