# ControlNet translator matching polygon_unet.yaml's (scaled-down,
# unconditional) channels.
_target_: models.translators.ControlNetTranslator
in_channels: ${thinker.vocab_size}
painter_channels: [32, 64, 64]
layers_per_block: 2
painter_size: ${data.image_size}
grid: 8             # image_size // grid_factor = 128 // 16
bridge_mode: "normalized"
with_timestep_emb: true
