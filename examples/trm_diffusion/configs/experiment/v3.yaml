# @package _global_
# Painter-thinker V3 — same as V2 but larger thinker latent (64 channels).

mode: "painter"
painter_variant: "v3"

run:
  output_dir: "runs/trm_v3"

thinker:
  puzzle_emb_ndim: 0
  halt_exploration_prob: 0.0
  optim:
    lr_min_ratio: 1.0

painter:
  thinker_out_channels: 64
  optim:
    lr_min_ratio: 1.0

train:
  batch_size: 384
  num_steps: 100000
  sudoku_loss_weight: 0.0
  gradient_accumulation_steps: 2

eval:
  eval_every: 2000
  save_every: 10000