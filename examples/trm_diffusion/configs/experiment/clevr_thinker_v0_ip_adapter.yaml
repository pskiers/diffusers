# @package _global_
# Stage 2: TRM thinker (V0, IPAdapter) with frozen CLEVR DiT.
# Extends CrossAttn with 12 per-block IP-Adapter cross-attention modules.
#
# Usage:
#   python train_trm.py experiment=clevr_thinker_v0_ip_adapter data=clevr \
#     clevr_painter_checkpoint=runs/clevr_dit_painter/checkpoint_final.pt

mode: "clevr_thinker"
painter_variant: "v0_ip_adapter"

defaults:
  - override /data: clevr

run:
  output_dir: "runs/clevr_thinker_v0_ip_adapter"

data:
  mode: "reduced"

clevr_painter_checkpoint: null   # REQUIRED

clevr_dit:
  vae_model_name: "stabilityai/sd-vae-ft-mse"
  latent_channels: 4
  latent_size: 32
  patch_size: 2
  num_attention_heads: 12
  attention_head_dim: 64
  num_layers: 12
  dropout: 0.0
  cond_embed_dim: 768
  image_size: 256

  optim:
    lr: 3e-5
    weight_decay: 0.0
    warmup_steps: 1000
    lr_min_ratio: 0.1

thinker:
  seq_len: 10
  hidden_size: 512
  n_heads: 8
  L_layers: 2
  L_cycles: 6
  H_cycles: 3
  n_sup: 16
  expansion: 4.0
  pos_encodings: "rope"
  mlp_t: false
  puzzle_emb_ndim: 0
  puzzle_emb_len: 0
  num_puzzle_identifiers: 1
  halt_exploration_prob: 0.0
  freeze_weights: false
  optim:
    lr: 1e-4
    lr_min_ratio: 0.1
    weight_decay: 1.0
    beta1: 0.9
    beta2: 0.95
    warmup_steps: 2000

clevr_thinker_model:
  diff_thinker_weight: 1.0
  painter_dtype: "bfloat16"
  latent_encoder_grid_size: 4
  caption_proj_freeze_steps: 999999

train:
  batch_size: 32
  num_steps: 150000
  gradient_accumulation_steps: 4
  cfg_prob: 0.0
  sudoku_loss_weight: 0.0
  mse_loss_weight: 1.0
  noisy_dropout_p_max: 0.0

eval:
  eval_every: 3000
  save_every: 15000
  log_every: 200
  cfg_scale: 2.0
  num_ddim_steps: 20
  num_log_images: 8

condition_encoder:
  _target_: models.condition_encoders.ObjectFeatureEncoder
  in_dim: ${data.object_feat_dim}
  hidden_dim: ${thinker.hidden_size}
  out_dim: ${thinker.hidden_size}
