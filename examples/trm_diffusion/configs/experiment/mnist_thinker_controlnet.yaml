# @package _global_
# Stage 2: TRM thinker with frozen MNIST UNet (ControlNet steering).
# Requires a trained mnist_unet_painter checkpoint.
#
# Usage:
#   python train_trm.py experiment=mnist_thinker_controlnet \
#     painter.checkpoint=runs/mnist_unet_painter/checkpoint_final.pt \
#     eval_callbacks.0.classifier_path=runs/mnist_classifier_cell16.pt

defaults:
  - override /data: mnist_sudoku
  - override /backbone: mnist_unet
  - override /painter: mnist_unet_controlnet_frozen
  - override /thinker: mnist
  - override /translator: controlnet
  - override /condition_encoder: spatial_image_v0
  - override /train: mnist_thinker
  - override /eval: mnist_thinker
  - override /loss: combined_mse
  - override /eval_callbacks: sudoku_thinker
  - override /sampling: cfg
  - _self_

mode: "thinker_base"

# puzzle_emb is for token-input thinkers; float enc_emb skips the puzzle-emb
# prepend in _input_embeddings, so z_H would be seq_len+puzzle_emb_len (97)
# but input_embeddings would be seq_len (81) — mismatch.
thinker:
  puzzle_emb_ndim: 0
  puzzle_emb_len: 0

run:
  output_dir: "runs/mnist_thinker_controlnet"
