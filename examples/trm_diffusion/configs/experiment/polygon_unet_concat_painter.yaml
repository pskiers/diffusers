# @package _global_
# Conditional Polygon UNetPainter (channel-concat, unscaled/paper-size
# backbone) — stage 1. See polygon_unet_concat_small_painter for the
# scaled-down variant.
# Usage: python train_trm.py experiment=polygon_unet_concat_painter
#
# Aligned to the paper's actual released training recipe — see
# steiner_unet_concat_painter.yaml's docstring for the full rationale (same
# paper, same shared training code, identical findings apply here). Backbone
# is now polygon_unet_paper (models.paper_unet.PaperUNet, BatchNorm+ReLU) —
# the paper explicitly states MaxAP uses "an identical U-Net backbone" to
# the other two tasks. configs/backbone/polygon_unet_concat.yaml (diffusers.
# UNet2DModel, GroupNorm+SiLU) remains available as +backbone=
# polygon_unet_concat for the norm/activation-choice ablation.

defaults:
  - override /data: polygon
  - override /backbone: polygon_unet_paper
  - override /painter: polygon_unet_concat_conditional
  - override /train: polygon
  - override /eval_callbacks: polygon
  - override /diffusion: ddpm_epsilon
  - override /sampling: direct
  - _self_

mode: "painter_base"

run:
  output_dir: "runs/polygon_unet_concat_painter"