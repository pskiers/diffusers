# @package _global_
# Painter-thinker (V0Tok) — original TRM thinker + diffusion painter.
# Thinker uses token input (same format as sudoku training).
# Sudoku CE loss trains the thinker; diffusion MSE trains the painter.

mode: "painter"

run:
  output_dir: "runs/trm_v0tok"

thinker:
  puzzle_emb_ndim: 512
  halt_exploration_prob: 0.0
  optim:
    lr_min_ratio: 1.0

painter:
  diff_thinker_weight: 0.0
  optim:
    lr_min_ratio: 1.0

train:
  batch_size: 384
  num_steps: 100000
  gradient_accumulation_steps: 2

eval:
  eval_every: 2000
  save_every: 10000