# @package _global_
# TRM thinker (V1, ControlNet) with frozen Amaze UNet painter.
# Usage:
#   python train_trm.py experiment=amaze_thinker_v1_controlnet \
#     painter.checkpoint=runs/amaze_unet_painter/checkpoint_final.pt

defaults:
  - override /data: amaze
  - override /backbone: amaze_unet
  - override /painter: amaze_unet_controlnet_frozen
  - override /thinker: amaze
  - override /translator: controlnet
  - override /condition_encoder: amaze_spatial_v1
  - override /train: mnist_thinker
  - override /eval: mnist_thinker
  - override /loss: combined_mse
  - override /eval_callbacks: amaze
  - override /sampling: cfg
  - _self_

mode: "thinker_base"

# Amaze is 3-channel RGB at 144x144
# mnist_thinker batch_size=384 OOMs the 40GB A100
# Here, effective batch (192*4 = 768) and gradient scaling are unchanged, only memory drops.
train:
  batch_size: 192
  gradient_accumulation_steps: 4
  max_seconds: 0 # (0 = no limit)

eval:
  batch_size: 128

thinker:
  puzzle_emb_ndim: 0
  puzzle_emb_len: 0
  seq_len: 49

translator:
  grid: 7

run:
  output_dir: "runs/amaze_thinker_v1_controlnet"
