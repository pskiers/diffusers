# @package _global_
# Stage 2: TRM thinker (V1, ControlNet) with frozen Amaze UNet painter.
# Usage:
#   python train_trm.py experiment=amaze_thinker_v1_controlnet \
#     painter.checkpoint=runs/amaze_unet_painter/checkpoint_final.pt

defaults:
  - override /data: amaze
  - override /backbone: amaze_unet
  - override /painter: amaze_unet_controlnet_frozen
  - override /thinker: mnist
  - override /translator: controlnet
  - override /condition_encoder: amaze_spatial_v1
  - override /train: mnist_thinker
  - override /eval: mnist_thinker
  - override /loss: combined_mse
  - override /eval_callbacks: amaze
  - override /sampling: cfg
  - _self_

mode: "thinker_base"

thinker:
  puzzle_emb_ndim: 0
  puzzle_emb_len: 0
  seq_len: 49

translator:
  grid: 7

run:
  output_dir: "runs/amaze_thinker_v1_controlnet"
