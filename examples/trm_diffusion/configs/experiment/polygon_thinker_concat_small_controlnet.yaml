# @package _global_
# Stage 2: TRM thinker with frozen conditional (channel-concat, scaled-down)
# Polygon painter — ControlNet steering added as a SEPARATE, additive signal
# on top of the painter's own (already-trained) conditioning, not a
# replacement of it. Requires a trained polygon_unet_concat_small_painter
# checkpoint.
#
# Usage:
#   python train_trm.py experiment=polygon_thinker_concat_small_controlnet \
#     painter.checkpoint=runs/polygon_unet_concat_small_painter/checkpoint_final.pt

defaults:
  - override /data: polygon
  - override /backbone: polygon_unet_concat_small
  - override /painter: polygon_unet_concat_small_controlnet_frozen
  - override /thinker: polygon
  - override /translator: controlnet_polygon_concat_small
  - override /condition_encoder: polygon_spatial_v0
  - override /train: polygon_thinker
  - override /eval: polygon_thinker
  - override /loss: combined_mse
  - override /eval_callbacks: polygon_thinker
  - override /sampling: cfg
  - _self_

mode: "thinker_base"

run:
  output_dir: "runs/polygon_thinker_concat_small_controlnet"

eval:
  step_timeout: 7200  # best-of-10 sampling + extraction/scoring across 3-4 point ranges
                       # measured up to ~60min total on the hardest range (41-50 pts) --
                       # extraction cost is O(n^2)-ish in vertex/point count, CPU-bound,
                       # independent of backbone size. Same fix as the painter-stage
                       # experiments (missed here originally -- thinker-stage uses the
                       # identical eval_callbacks, so the identical timeout risk applies).
