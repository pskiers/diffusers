# @package _global_
# Stage 2: TRM thinker with frozen Maze UNet (ControlNet steering).
# Requires a trained maze_unet_painter checkpoint.
#
# Usage:
#   python train_trm.py experiment=maze_thinker_controlnet \
#     painter.checkpoint=runs/maze_unet_painter/checkpoint_final.pt

defaults:
  - override /data: maze
  - override /backbone: maze_unet
  - override /painter: maze_unet_controlnet_frozen
  - override /thinker: maze
  - override /translator: controlnet_maze
  - override /condition_encoder: maze_spatial_v0
  - override /train: maze_thinker
  - override /eval: maze_thinker
  - override /loss: combined_mse
  - override /eval_callbacks: maze_thinker
  - override /sampling: cfg
  - _self_

mode: "thinker_base"

# puzzle_emb is for token-input thinkers; float enc_emb skips the puzzle-emb
# prepend in _input_embeddings, so z_H would be seq_len+puzzle_emb_len (80)
# but input_embeddings would be seq_len (64) — mismatch.
thinker:
  puzzle_emb_ndim: 0
  puzzle_emb_len: 0

run:
  output_dir: "runs/maze_thinker_controlnet"
