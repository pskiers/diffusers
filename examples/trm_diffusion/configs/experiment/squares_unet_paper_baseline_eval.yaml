# @package _global_
# Evaluate a frozen Squares painter checkpoint through eval.py, with NO
# thinker attached at all -- see steiner_unet_paper_baseline_eval.yaml for
# the full rationale (same pattern, just Squares' data/backbone/eval_callbacks).
#
# Usage:
#   python eval.py experiment=squares_unet_paper_baseline_eval \
#     +painter.checkpoint_source=original_repo \
#     painter.checkpoint=<path/to/checkpoints_curves/checkpoint_520.pth>

defaults:
  - override /data: squares
  - override /backbone: squares_unet_paper
  - override /painter: squares_unet_concat_controlnet_frozen
  - override /train: squares
  - override /eval_callbacks: squares
  - override /diffusion: ddim_epsilon
  - override /sampling: direct
  - _self_

mode: "painter_base"

run:
  output_dir: "runs/squares_unet_paper_baseline_eval"

# see steiner_unet_paper_baseline_eval.yaml -- the shared frozen-painter
# config doesn't set eval_callbacks itself, needed here since there's no
# thinker wrapper to attach them to instead.
painter:
  eval_callbacks: ${eval_callbacks}
