# @package _global_
# Painter-thinker V0 with two-stage interleaved training.
# Painter stage: encoder sees the full solution image (teacher forcing).
# Thinker stage: encoder sees the partial puzzle image, painter frozen, CE only.

mode: "painter"
painter_variant: "v0"

run:
  output_dir: "runs/trm_v0_two_stage"

thinker:
  puzzle_emb_ndim: 0
  num_classes: 9
  halt_exploration_prob: 0.0

painter:
  diff_thinker_weight: 0.0

train:
  lr_min_ratio: 1.0
  batch_size: 384
  num_steps: 100000
  gradient_accumulation_steps: 2

eval:
  eval_every: 2000
  save_every: 10000

painter_stage:
  n_sup: 4
  H_cycles: 1
  L_cycles: 2
  freeze_thinker: false
  every: 1

thinker_stage:
  n_sup: 16
  every: 1
