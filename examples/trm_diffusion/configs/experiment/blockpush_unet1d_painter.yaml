# @package _global_
# Base diffusion model for BlockPush (lowdim obs), conv1d U-Net backbone.
# Usage: python train_trm.py experiment=blockpush_unet1d_painter
defaults:
  - override /data: blockpush_lowdim
  - override /diffusion: ddpm_epsilon
  - override /backbone: blockpush_unet1d
  - override /painter: action_unet1d
  - override /condition_encoder: lowdim_obs
  - override /train: action_lowdim
  - override /eval: action_lowdim
  - override /eval_callbacks: blockpush
  - override /sampling: action_direct
  - _self_

mode: "painter_base"

run:
  output_dir: "runs/blockpush_unet1d_painter"
