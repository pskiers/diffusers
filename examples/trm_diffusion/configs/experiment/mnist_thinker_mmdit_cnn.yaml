# @package _global_
# Stage 2, the step between mnist_thinker_controlnet (works) and
# mnist_thinker_mmdit: the same frozen MM-DiT Sudoku painter and block-residual
# steering, but the thinker reads the puzzle image and x_t through the CNN encoder
# of the working UNet / DiT runs (NoisySpatialConditionEncoder, no timestep
# embedding, no noisy dropout — as x0_hint_v1 with enabled=false there) instead
# of the painter's hidden states, and outputs the same 11 logits per cell. Its
# 9x9 grid is upsampled to the painter's 12x12 token grid.
#
# Usage:
#   python train_trm.py experiment=mnist_thinker_mmdit_cnn \
#     painter.checkpoint=runs/mnist_mmdit_painter/checkpoint_final.pt

defaults:
  - override /data: mnist_sudoku
  - override /diffusion: flow
  - override /painter: mmdit_sudoku_frozen
  - override /thinker: mnist
  - override /condition_encoder: spatial_image_v1
  - override /translator: painter_residual
  - override /train: mnist_thinker
  - override /eval: mnist_thinker
  - override /loss: combined_mse
  - override /eval_callbacks: sudoku_thinker
  - override /sampling: flow_cfg
  - _self_

mode: "thinker_base"

thinker:
  puzzle_emb_ndim: 0
  puzzle_emb_len: 0
  optim_cfg:
    weight_decay: 0.3  # 1.0 shrinks the thinker's output while the zero-init translator grows

condition_encoder:
  noisy_dropout_p_max: 0.0
  with_timestep_emb: false

translator:
  grid: 9
  painter_grid: 12
  num_blocks: 4
  bridge_mode: normalized

run:
  output_dir: "runs/mnist_thinker_mmdit_cnn"
