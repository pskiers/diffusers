# @package _global_
# TRM thinker + frozen ToolHang-lowdim conv1d U-Net painter (ControlNet1D steering).
# Requires a trained toolhang_lowdim_unet1d_painter checkpoint.
#
# Usage:
#   python train_trm.py experiment=toolhang_lowdim_unet1d_thinker_controlnet \
#     painter.checkpoint=runs/toolhang_lowdim_unet1d_painter/checkpoint_final.pt

defaults:
  - override /data: toolhang_lowdim
  - override /diffusion: ddpm_epsilon
  - override /backbone: toolhang_lowdim_unet1d
  - override /painter: action_unet1d_controlnet1d_frozen_lowdim
  - override /thinker: action
  - override /translator: controlnet1d_small
  - override /condition_encoder: lowdim_obs_trm
  - override /train: action_lowdim
  - override /eval: action_lowdim
  - override /loss: mse
  - override /eval_callbacks: toolhang_lowdim
  - override /sampling: action_direct
  - _self_

mode: "action_thinker_base"

run:
  output_dir: "runs/toolhang_lowdim_unet1d_thinker_controlnet"
