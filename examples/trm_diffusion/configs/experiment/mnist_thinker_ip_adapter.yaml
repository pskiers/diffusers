# @package _global_
# Stage 2: TRM thinker with frozen MNIST DiT (IP-Adapter steering).
# Requires a trained mnist_dit_painter checkpoint.
# IP-Adapter adds trainable per-block cross-attention on top of the frozen DiT.
#
# Usage:
#   python train_trm.py experiment=mnist_thinker_ip_adapter \
#     painter.checkpoint=runs/mnist_dit_painter/checkpoint_final.pt \
#     eval_callbacks.0.classifier_path=runs/mnist_classifier_cell16.pt

defaults:
  - override /data: mnist_sudoku
  - override /backbone: mnist_dit
  - override /vae: mnist_kl
  - override /painter: mnist_dit_ip_adapter_frozen
  - override /thinker: mnist
  - override /translator: ip_adapter_mnist
  - override /condition_encoder: spatial_image_v0
  - override /train: mnist_thinker
  - override /eval: mnist_thinker
  - override /loss: combined_mse
  - override /eval_callbacks: sudoku_thinker
  - override /sampling: cfg
  - _self_

mode: "thinker_base"

run:
  output_dir: "runs/mnist_thinker_ip_adapter"
