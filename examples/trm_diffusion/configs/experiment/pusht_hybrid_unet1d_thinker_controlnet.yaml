# @package _global_
# TRM thinker + frozen PushT-hybrid (image) conv1d U-Net painter (ControlNet1D steering).
# Requires a trained pusht_hybrid_unet1d_painter checkpoint.
#
# Usage:
#   python train_trm.py experiment=pusht_hybrid_unet1d_thinker_controlnet \
#     painter.checkpoint=runs/pusht_hybrid_unet1d_painter/checkpoint_final.pt

defaults:
  - override /data: pusht_hybrid
  - override /diffusion: ddpm_epsilon
  - override /backbone: pusht_hybrid_unet1d
  - override /painter: action_unet1d_controlnet1d_frozen_image
  - override /thinker: action
  - override /translator: controlnet1d_large
  - override /condition_encoder: image_obs_trm
  - override /train: action_image_small
  - override /eval: action_image_small
  - override /loss: mse
  - override /eval_callbacks: pusht
  - override /sampling: action_direct
  - _self_

mode: "action_thinker_base"

run:
  output_dir: "runs/pusht_hybrid_unet1d_thinker_controlnet"
