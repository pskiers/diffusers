# @package _global_
# Same architecture as mnist_thinker_v1_controlnet (TRM thinker steering a
# ControlNet-converted UNet painter), but the painter is randomly initialized
# and trained JOINTLY with the thinker from scratch in this one run, instead
# of being pretrained unconditionally first and then frozen. Ablation: does
# painter pretraining actually matter, or is joint training from scratch
# enough on its own?
#
# No painter.checkpoint needed -- JointControlNetUNetPainter has no
# checkpoint arg at all, unlike ControlNetSteeredUNetPainter.
#
# Usage:
#   python train_trm.py experiment=mnist_thinker_v1_controlnet_joint \
#     eval_callbacks.0.classifier_path=runs/mnist_classifier_cell16.pt

defaults:
  - override /data: mnist_sudoku
  - override /backbone: mnist_unet
  - override /painter: mnist_unet_controlnet_joint
  - override /thinker: mnist
  - override /translator: controlnet
  - override /condition_encoder: spatial_image_v1
  - override /train: mnist_thinker
  - override /eval: mnist_thinker
  - override /loss: combined_mse
  - override /eval_callbacks: sudoku_thinker
  - override /sampling: cfg
  - _self_

mode: "thinker_base"

thinker:
  puzzle_emb_ndim: 0
  puzzle_emb_len: 0

run:
  output_dir: "runs/mnist_thinker_v1_controlnet_joint"
