# @package _global_
# Stage 1: train StandaloneClevrDiT on CLEVR (relative mode).
# Target: ~90% relationship accuracy.  This checkpoint is then frozen and used
# by the thinker experiments below.
#
# Usage:
#   python train_trm.py experiment=clevr_dit_painter data=clevr

mode: "clevr_painter"

defaults:
  - override /data: clevr

run:
  output_dir: "runs/clevr_dit_painter"

# DiT architecture (mirrors old clevr_vit_std.yaml)
clevr_dit:
  vae_model_name: "stabilityai/sd-vae-ft-mse"
  latent_channels: 4
  latent_size: 32
  patch_size: 2
  num_attention_heads: 12
  attention_head_dim: 64     # inner_dim = 12*64 = 768
  num_layers: 12
  dropout: 0.0
  cond_embed_dim: 768        # = inner_dim
  image_size: 256

  optim:
    lr: 1e-4
    weight_decay: 0.0
    warmup_steps: 2000
    lr_min_ratio: 0.1

train:
  batch_size: 64
  num_steps: 200000
  gradient_accumulation_steps: 4
  cfg_prob: 0.1
  sudoku_loss_weight: 0.0
  mse_loss_weight: 1.0

eval:
  eval_every: 5000
  save_every: 20000
  log_every: 200
  cfg_scale: 2.0
  num_ddim_steps: 20
  num_log_images: 8
