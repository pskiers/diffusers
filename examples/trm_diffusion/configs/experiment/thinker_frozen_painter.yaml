# @package _global_
# Thinker with frozen pretrained painter.
# Loads a StandalonePainter checkpoint, freezes bridge+UNet, trains only the thinker
# with diffusion loss only (no sudoku CE loss).
#
# Usage:
#   python train_trm.py experiment=thinker_frozen_painter \
#     painter.painter_checkpoint=runs/standalone_painter/checkpoint_final.pt

mode: "thinker_frozen_painter"

run:
  output_dir: "runs/thinker_frozen_painter"

thinker:
  puzzle_emb_ndim: 0
  optim:
    lr_min_ratio: 0.1

painter:
  thinker_bridge_mode: "logits"
  adapter_in_channels: 0
  painter_checkpoint: null   # REQUIRED: path to StandalonePainter checkpoint

train:
  batch_size: 768
  num_steps: 50000
  sudoku_loss_weight: 0.0
  classifier_loss:
    t_max: 100
    target: "x_tm1"

eval:
  eval_every: 1000
  save_every: 5000
  cfg_scale: 2.0