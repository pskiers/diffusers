# @package _global_
# UNetPainter on CLEVR relative mode (cross-attention on object features).
# Usage: python train_trm.py experiment=clevr_unet_painter_relative data=clevr

mode: "painter_base"

defaults:
  - override /data: clevr

run:
  output_dir: "runs/clevr_unet_painter_relative"

data:
  mode: "relative"

model:
  _target_: models.painter_base.UNetPainter
  scaling_factor: 0.18215
  condition_field: "embedding_conditions"
  vae:
    _target_: models.utility_models.load_frozen_vae
    pretrained_model_name_or_path: "stabilityai/sd-vae-ft-mse"
  unet:
    _target_: diffusers.UNet2DConditionModel
    sample_size: 32
    in_channels: 4
    out_channels: 4
    cross_attention_dim: 512
    block_out_channels: [128, 256, 512, 512]
  condition_encoder:
    _target_: models.clevr_painters.ClevrObjectEncoder
    in_dim: 55
    hidden_dim: 512
    out_dim: 512
  eval_callbacks:
    - _target_: models.eval_callbacks.ImageGenEvalCallback
  optim_cfg:
    _target_: configs.schemas.PainterOptimConfig
    lr: 1e-4
    weight_decay: 0.0
    warmup_steps: 2000
    lr_min_ratio: 0.1

train:
  seed: 42
  batch_size: 32
  num_steps: 200000
  gradient_accumulation_steps: 8
  cfg_prob: 0.1
  mse_loss_weight: 1.0

eval:
  eval_every: 5000
  save_every: 20000
  log_every: 200
  cfg_scale: 2.0
  num_ddim_steps: 20
  num_log_images: 8
