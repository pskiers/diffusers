# @package _global_
# Painter-thinker V0 — image-conditioned thinker, clean puzzle image only.
# Encoder sees condition (partial puzzle image, 1 channel).
# Thinker outputs 9-class digit logits; sudoku CE loss + diffusion MSE.

mode: "painter"
painter_variant: "v0"
output_dir: "runs/trm_v0"
compile: true

use_ema: true
ema_rate: 0.999

thinker:
  puzzle_emb_ndim: 0
  num_classes: 9
  n_sup: 16
  hidden_size: 512
  halt_exploration_prob: 0.0

painter:
  enc_channels: 32
  bridge_channels: 16
  painter_channels: [32, 64, 64]
  painter_layers_per_block: 2
  diff_thinker_weight: 1.0
  dtype: bfloat16

data:
  cell_size: 16    # grid = 9*16 = 144 px

train:
  lr: 1e-4
  lr_min_ratio: 1.0
  weight_decay: 1.0
  batch_size: 384
  num_steps: 100000
  warmup_steps: 2000
  eval_every: 2000
  save_every: 10000
  sudoku_loss_weight: 1.0
  gradient_accumulation_steps: 2
