# @package _global_
# DiTPainter on CLEVR reduced mode — uses DiTPainter base class so it can be
# wrapped in CrossAttnSteeredDiTPainter for stage-2 thinker training.
# Usage: python train_trm.py experiment=clevr_dit_painter_v2_reduced data=clevr

mode: "painter_base"

defaults:
  - override /data: clevr

run:
  output_dir: "runs/clevr_dit_painter_v2_reduced"

data:
  mode: "reduced"

model:
  _target_: models.painter_base.DiTPainter
  condition_field: "embedding_conditions"
  vae:
    _target_: models.utility_models.load_frozen_vae
    pretrained_model_name_or_path: "stabilityai/sdxl-vae"
  dit:
    _target_: diffusers.Transformer2DModel
    num_attention_heads: 12
    attention_head_dim: 64       # inner_dim = 768
    in_channels: 4
    out_channels: 4
    num_layers: 12
    cross_attention_dim: 768
    sample_size: 32
    patch_size: 2
    norm_type: "ada_norm_single"
    attention_bias: true
    activation_fn: "gelu-approximate"
    caption_channels: 768
  condition_encoder:
    _target_: models.clevr_painters.ClevrObjectEncoder
    in_dim: 55
    hidden_dim: 768
    out_dim: 768
  eval_callbacks:
    - _target_: eval.clevr_eval_callbacks.ClevrImageLogCallback
      root_dir: "${data.clevr_root}"
      mode: "${data.mode}"   # matches data.mode
      n_scenes: 8
      min_objects: 3
      max_objects: 8
    - _target_: eval.clevr_eval_callbacks.ClevrMetricsCallback
      root_dir: "${data.clevr_root}"
      mode: "${data.mode}"
      n_samples: 1000
      batch_size: 64

  optim_cfg:
    _target_: configs.schemas.PainterOptimConfig
    lr: 1e-4
    weight_decay: 0.0
    warmup_steps: 2000
    lr_min_ratio: 0.1

train:
  seed: 42
  batch_size: 64
  num_steps: 200000
  gradient_accumulation_steps: 4
  cfg_prob: 0.1
  mse_loss_weight: 1.0

eval:
  eval_every: 5000
  save_every: 20000
  log_every: 200
  cfg_scale: 2.0
  num_ddim_steps: 20
  num_log_images: 8
