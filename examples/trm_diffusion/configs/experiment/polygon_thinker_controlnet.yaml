# @package _global_
# Stage 2: TRM thinker with frozen unconditional Polygon UNet (ControlNet
# steering). Requires a trained polygon_unet_painter checkpoint.
#
# Usage:
#   python train_trm.py experiment=polygon_thinker_controlnet \
#     painter.checkpoint=runs/polygon_unet_painter/checkpoint_final.pt

defaults:
  - override /data: polygon
  - override /backbone: polygon_unet
  - override /painter: polygon_unet_controlnet_frozen
  - override /thinker: polygon
  - override /translator: controlnet_polygon
  - override /condition_encoder: polygon_spatial_v0
  - override /train: polygon_thinker
  - override /eval: polygon_thinker
  - override /loss: combined_mse
  - override /eval_callbacks: polygon_thinker
  - override /sampling: cfg
  - _self_

mode: "thinker_base"

run:
  output_dir: "runs/polygon_thinker_controlnet"
