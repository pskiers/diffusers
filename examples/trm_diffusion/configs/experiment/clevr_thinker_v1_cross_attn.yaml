# @package _global_
# Stage 2: TRM thinker (V1, CrossAttn) with frozen CLEVR DiT.
# V1 = TRM sees object embeddings + noisy latent tokens (grid_size²=16 tokens).
# seq_len = max_objects(10) + grid_size²(16) = 26
#
# Usage:
#   python train_trm.py experiment=clevr_thinker_v1_cross_attn data=clevr \
#     clevr_painter_checkpoint=runs/clevr_dit_painter/checkpoint_final.pt

mode: "clevr_thinker"
painter_variant: "v1_cross_attn"

defaults:
  - override /data: clevr

run:
  output_dir: "runs/clevr_thinker_v1_cross_attn"

data:
  mode: "reduced"

clevr_painter_checkpoint: null   # REQUIRED

clevr_dit:
  vae_model_name: "stabilityai/sd-vae-ft-mse"
  latent_channels: 4
  latent_size: 32
  patch_size: 2
  num_attention_heads: 12
  attention_head_dim: 64
  num_layers: 12
  dropout: 0.0
  cond_embed_dim: 768
  image_size: 256

  optim:
    lr: 3e-5
    weight_decay: 0.0
    warmup_steps: 1000
    lr_min_ratio: 0.1

clevr_thinker_model:
  diff_thinker_weight: 1.0
  painter_dtype: "bfloat16"
  latent_encoder_grid_size: 4   # G=4 → G²=16 latent tokens; seq_len=10+16=26
  caption_proj_freeze_steps: 999999

# V1: seq_len = max_objects + latent_encoder_grid_size² = 10 + 16 = 26
thinker:
  seq_len: 26
  hidden_size: 512
  n_heads: 8
  L_layers: 2
  L_cycles: 6
  H_cycles: 3
  n_sup: 16
  expansion: 4.0
  pos_encodings: "rope"
  mlp_t: false
  puzzle_emb_ndim: 0
  puzzle_emb_len: 0
  num_puzzle_identifiers: 1
  halt_exploration_prob: 0.0
  freeze_weights: false
  optim:
    lr: 1e-4
    lr_min_ratio: 0.1
    weight_decay: 1.0
    beta1: 0.9
    beta2: 0.95
    warmup_steps: 2000

train:
  batch_size: 32
  num_steps: 150000
  gradient_accumulation_steps: 4
  cfg_prob: 0.0
  sudoku_loss_weight: 0.0
  mse_loss_weight: 1.0
  noisy_dropout_p_max: 0.3    # zero out noisy latent input with this max probability

eval:
  eval_every: 3000
  save_every: 15000
  log_every: 200
  cfg_scale: 2.0
  num_ddim_steps: 20
  num_log_images: 8

condition_encoder:
  _target_: models.condition_encoders.ObjectFeatureEncoderV1
  in_dim: ${data.object_feat_dim}
  hidden_dim: ${thinker.hidden_size}
  out_dim: ${thinker.hidden_size}
  latent_channels: ${clevr_dit.latent_channels}
  hidden_size: ${thinker.hidden_size}
  grid_size: ${clevr_thinker_model.latent_encoder_grid_size}
  noisy_dropout_p_max: ${train.noisy_dropout_p_max}
  num_train_timesteps: 1000
