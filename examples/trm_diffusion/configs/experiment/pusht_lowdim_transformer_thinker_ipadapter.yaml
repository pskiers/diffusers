# @package _global_
# TRM thinker + frozen PushT-lowdim transformer painter (IP-Adapter steering).
# Requires a trained pusht_lowdim_transformer_painter checkpoint.
#
# Usage:
#   python train_trm.py experiment=pusht_lowdim_transformer_thinker_ipadapter \
#     painter.checkpoint=runs/pusht_lowdim_transformer_painter/checkpoint_final.pt

defaults:
  - override /data: pusht_lowdim
  - override /diffusion: ddpm_epsilon
  - override /backbone: pusht_lowdim_transformer
  - override /painter: action_transformer_ipadapter_frozen_lowdim
  - override /thinker: action
  - override /translator: ipadapter_action
  - override /condition_encoder: lowdim_obs_trm
  - override /train: action_thinker_lowdim
  - override /eval: action_thinker_lowdim
  - override /loss: mse
  - override /eval_callbacks: pusht_lowdim
  - override /sampling: action_direct
  - _self_

mode: "action_thinker_base"

run:
  output_dir: "runs/pusht_lowdim_transformer_thinker_ipadapter"
