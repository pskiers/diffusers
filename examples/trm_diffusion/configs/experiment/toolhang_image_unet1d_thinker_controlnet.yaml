# @package _global_
# TRM thinker + frozen ToolHang-image conv1d U-Net painter (ControlNet1D steering).
# Requires a trained toolhang_image_unet1d_painter checkpoint.
# (No transformer/IP-Adapter variant for toolhang_image — no base transformer
# painter was trained for this task.)
#
# Usage:
#   python train_trm.py experiment=toolhang_image_unet1d_thinker_controlnet \
#     painter.checkpoint=runs/toolhang_image_unet1d_painter/checkpoint_final.pt

defaults:
  - override /data: toolhang_image
  - override /diffusion: ddpm_epsilon
  - override /backbone: toolhang_image_unet1d
  - override /painter: action_unet1d_controlnet1d_frozen_image
  - override /thinker: action
  - override /translator: controlnet1d_large
  - override /condition_encoder: image_obs_trm
  - override /train: action_image_large
  - override /eval: action_image_large
  - override /loss: mse
  - override /eval_callbacks: toolhang
  - override /sampling: action_direct
  - _self_

mode: "action_thinker_base"

run:
  output_dir: "runs/toolhang_image_unet1d_thinker_controlnet"
