# @package _global_
# Same paper-size Steiner UNetPainter as steiner_unet_concat_painter.yaml
# (architecture, epsilon prediction, optimizer/lr schedule all identical),
# except trained with classifier-free guidance dropout (train.cfg_prob=0.1
# via configs/train/steiner_cfg.yaml) and sampled with CFG (scale 2.0) via
# configs/sampling/cfg_99.yaml, instead of the paper's own cfg_prob=0 /
# guidance-scale=1 recipe. Ablation: does CFG help beyond the paper's
# reported numbers, holding everything else fixed.
# Usage: python train_trm.py experiment=steiner_unet_concat_painter_cfg

defaults:
  - override /data: steiner
  - override /backbone: steiner_unet_paper
  - override /painter: steiner_unet_concat_conditional
  - override /train: steiner_cfg
  - override /eval_callbacks: steiner
  - override /diffusion: ddim_epsilon
  - override /sampling: cfg_99
  - _self_

mode: "painter_base"

run:
  output_dir: "runs/steiner_unet_concat_painter_cfg"

eval:
  step_timeout: 7200  # best-of-10 sampling + extraction/scoring across 3-4 point ranges
                       # measured up to ~60min total on the hardest range (41-50 pts) --
                       # extraction cost is O(n^2)-ish in vertex/point count, CPU-bound,
                       # independent of backbone size. Default (3600s) was too tight.
