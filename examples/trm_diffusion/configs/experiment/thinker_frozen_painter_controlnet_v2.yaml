# @package _global_
# Thinker with frozen ControlNet painter — V2 clean base class.
# Equivalent run to thinker_frozen_painter_controlnet at commit 1af485f,
# but using ThinkerWithFrozenPainterControlNetV2 / ThinkerFrozenPainterBase.
#
# Usage:
#   python train_trm.py experiment=thinker_frozen_painter_controlnet_v2 \
#     painter.painter_channels=[32,64,64] painter.thinker_bridge_mode=softmax \
#     painter.enc_channels=128 painter.enc_hidden_channels=[128,256,256] \
#     painter.painter_checkpoint=runs/standalone_painter_control_uncond/checkpoint_final.pt \
#     eval.classifier_path=runs/mnist_classifier_cell16.pt \
#     run.output_dir=runs/thinker_frozen_painter_controlnet_v2_100k \
#     train.num_steps=100000

mode: "thinker_frozen_painter"
painter_variant: "controlnet_v2"

run:
  output_dir: "runs/thinker_frozen_painter_controlnet_v2"

thinker:
  puzzle_emb_ndim: 0
  num_classes: 9
  optim:
    lr_min_ratio: 0.1

painter:
  painter_checkpoint: null   # REQUIRED: path to StandalonePainterControl checkpoint
  painter_channels: [32, 64, 64]
  thinker_bridge_mode: softmax
  enc_channels: 128
  enc_hidden_channels: [128, 256, 256]
  painter_layers_per_block: 2
  optim:
    lr_min_ratio: 0.1

train:
  batch_size: 384
  num_steps: 100000
  sudoku_loss_weight: 0.0
  gradient_accumulation_steps: 2

eval:
  eval_every: 2000
  save_every: 10000
  cfg_scale: 2.0

condition_encoder:
  _target_: models.condition_encoders.SpatialImageEncoder
  in_channels: 1
  enc_channels: ${painter.enc_channels}
  hidden_channels: ${painter.enc_hidden_channels}
  output_dim: ${thinker.hidden_size}
  factor: ${data.cell_size}
  use_noisy_input: false
