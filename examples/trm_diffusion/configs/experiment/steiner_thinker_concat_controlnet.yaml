# @package _global_
# Stage 2: TRM thinker with frozen conditional (channel-concat, unscaled/
# paper-size) Steiner painter — ControlNet steering added as a SEPARATE,
# additive signal on top of the painter's own (already-trained) conditioning,
# not a replacement of it. Requires a trained steiner_unet_concat_painter
# checkpoint.
#
# Usage:
#   python train_trm.py experiment=steiner_thinker_concat_controlnet \
#     painter.checkpoint=runs/steiner_unet_concat_painter/checkpoint_final.pt

# 2026-08-03: diffusion overridden to ddpm_epsilon to match
# steiner_unet_concat_painter's now-corrected training recipe (epsilon
# prediction) — the frozen painter checkpoint's scheduler config MUST agree
# with however it was trained, or its outputs get silently misinterpreted.
# Sampling stays CFG here deliberately (unlike the painter's own fix) — this
# is the thinker stage's own steering-ablation contrast (with vs. without
# the whole two-stage conditioning), a project-specific addition with no
# analog in the paper's single-stage model, not the painter's original
# training-time CFG which no longer applies once frozen.
defaults:
  - override /data: steiner
  - override /backbone: steiner_unet_concat
  - override /painter: steiner_unet_concat_controlnet_frozen
  - override /thinker: steiner
  - override /translator: controlnet_steiner_concat
  - override /condition_encoder: steiner_spatial_v0
  - override /train: steiner_thinker
  - override /eval: steiner_thinker
  - override /loss: combined_mse
  - override /eval_callbacks: steiner_thinker
  - override /diffusion: ddim_epsilon
  - override /sampling: cfg
  - _self_

mode: "thinker_base"

run:
  output_dir: "runs/steiner_thinker_concat_controlnet"

eval:
  step_timeout: 7200  # best-of-10 sampling + extraction/scoring across 3-4 point ranges
                       # measured up to ~60min total on the hardest range (41-50 pts) --
                       # extraction cost is O(n^2)-ish in vertex/point count, CPU-bound,
                       # independent of backbone size. Same fix as the painter-stage
                       # experiments (missed here originally -- thinker-stage uses the
                       # identical eval_callbacks, so the identical timeout risk applies).
