# @package _global_
# Stage 2: TRM thinker with frozen Steiner UNet (ControlNet steering).
# Requires a trained steiner_unet_painter checkpoint.
#
# Usage:
#   python train_trm.py experiment=steiner_thinker_controlnet \
#     painter.checkpoint=runs/steiner_unet_painter/checkpoint_final.pt

defaults:
  - override /data: steiner
  - override /backbone: steiner_unet
  - override /painter: steiner_unet_controlnet_frozen
  - override /thinker: steiner
  - override /translator: controlnet_steiner
  - override /condition_encoder: steiner_spatial_v0
  - override /train: steiner_thinker
  - override /eval: steiner_thinker
  - override /loss: combined_mse
  - override /eval_callbacks: steiner_thinker
  - override /sampling: cfg
  - _self_

mode: "thinker_base"

run:
  output_dir: "runs/steiner_thinker_controlnet"
