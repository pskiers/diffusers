# @package _global_
# Standalone SPADE painter: solution tokens → one-hot → bilinear upsample →
# SPADE semantic map fed to every ResBlock norm (no bridge concatenation).

mode: "standalone_painter_spade"

run:
  output_dir: "runs/standalone_painter_spade"

train:
  lr_min_ratio: 1.0
  weight_decay: 0.01
  batch_size: 384
  num_steps: 100000
  sudoku_loss_weight: 0.0
  gradient_accumulation_steps: 2

eval:
  eval_every: 2000
  save_every: 10000
