# @package _global_
# Unconditional UNetPainter on MNIST Sudoku images.
# Pure pixel-space diffusion — no conditioning, no bridge, no thinker.
# Useful as a generative baseline / sanity check that the painter learns
# the image distribution.
# Usage: python train_trm.py experiment=mnist_unet_painter

mode: "painter_base"

run:
  output_dir: "runs/mnist_unet_painter"

model:
  _target_: models.painter_base.UNetPainter
  unet:
    _target_: diffusers.UNet2DModel
    sample_size: 144
    in_channels: 1
    out_channels: 1
    block_out_channels: [32, 64, 64]
    down_block_types: ["DownBlock2D", "DownBlock2D", "DownBlock2D"]
    up_block_types: ["UpBlock2D", "UpBlock2D", "UpBlock2D"]
    norm_num_groups: 32
    layers_per_block: 2
  eval_callbacks:
    - _target_: models.eval_callbacks.ImageGenEvalCallback

  optim_cfg:
    _target_: configs.schemas.PainterOptimConfig
    lr: 1e-4
    weight_decay: 0.01
    warmup_steps: 2000
    lr_min_ratio: 1.0

train:
  seed: 42
  batch_size: 384
  num_steps: 100000
  gradient_accumulation_steps: 2
  cfg_prob: 0.0
  mse_loss_weight: 1.0

eval:
  eval_every: 2000
  save_every: 10000
  log_every: 200
  cfg_scale: 1.0
  num_ddim_steps: 20
  num_log_images: 8
