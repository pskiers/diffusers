# @package _global_
# Painter-thinker (V0Tok) with two-stage interleaved training.
# Painter stage: teacher forcing with full solution tokens.
# Thinker stage: real puzzle tokens, painter frozen, CE loss only.

mode: "painter"

run:
  output_dir: "runs/trm_v0tok_two_stage"

thinker:
  puzzle_emb_ndim: 512
  halt_exploration_prob: 0.0
  optim:
    lr_min_ratio: 1.0

painter:
  diff_thinker_weight: 0.0
  thinker_bridge_mode: logits
  optim:
    lr_min_ratio: 1.0

train:
  batch_size: 384
  num_steps: 100000
  gradient_accumulation_steps: 2
  two_stage:
    painter:
      freeze_thinker: false
      n_sup: 4
      H_cycles: 1
      L_cycles: 2
      every: 1
    thinker:
      n_sup: 16
      every: 1

eval:
  eval_every: 2000
  save_every: 10000