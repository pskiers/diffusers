# @package _global_
# Same paper-size Polygon UNetPainter as polygon_unet_concat_painter.yaml
# (architecture, epsilon prediction, optimizer/lr schedule all identical),
# except trained with classifier-free guidance dropout (train.cfg_prob=0.1
# via configs/train/polygon_cfg.yaml) and sampled with CFG (scale 2.0) via
# configs/sampling/cfg_99.yaml, instead of the paper's own cfg_prob=0 /
# guidance-scale=1 recipe. Ablation: does CFG help beyond the paper's
# reported numbers, holding everything else fixed.
# Usage: python train_trm.py experiment=polygon_unet_concat_painter_cfg

defaults:
  - override /data: polygon
  - override /backbone: polygon_unet_paper
  - override /painter: polygon_unet_concat_conditional
  - override /train: polygon_cfg
  - override /eval_callbacks: polygon
  - override /diffusion: ddim_epsilon
  - override /sampling: cfg_99
  - _self_

mode: "painter_base"

run:
  output_dir: "runs/polygon_unet_concat_painter_cfg"
