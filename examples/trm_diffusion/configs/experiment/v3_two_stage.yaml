# @package _global_
# Painter-thinker V3 with two-stage interleaved training.

mode: "painter"
painter_variant: "v3"

run:
  output_dir: "runs/trm_v3_two_stage"

thinker:
  puzzle_emb_ndim: 0
  halt_exploration_prob: 0.0

painter:
  thinker_out_channels: 64

train:
  lr_min_ratio: 1.0
  batch_size: 384
  num_steps: 100000
  sudoku_loss_weight: 0.0
  gradient_accumulation_steps: 2

eval:
  eval_every: 2000
  save_every: 10000

painter_stage:
  freeze_thinker: false
  n_sup: 4
  H_cycles: 1
  L_cycles: 2
  every: 1

thinker_stage:
  n_sup: 16
  every: 1
