# @package _global_
# Standalone ControlNet painter: solution tokens → one-hot → bilinear upsample →
# ConditioningPyramid → multi-scale residuals injected into UNet skip connections.

mode: "standalone_painter_control"

run:
  output_dir: "runs/standalone_painter_control"

painter:
  optim:
    lr_min_ratio: 1.0
    weight_decay: 0.01

train:
  batch_size: 384
  num_steps: 100000
  sudoku_loss_weight: 0.0
  gradient_accumulation_steps: 2

eval:
  eval_every: 2000
  save_every: 10000