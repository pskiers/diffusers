# @package _global_
# Painter-thinker V4 — AttentiveBridge + decoupled compression factor.
# compression_factor=16 → 9×9 thinker grid (same as V3 at cell_size=16).

mode: "painter"
painter_variant: "v4"

run:
  output_dir: "runs/trm_v4"

thinker:
  puzzle_emb_ndim: 0
  halt_exploration_prob: 0.0

painter:
  thinker_out_channels: 64
  compression_factor: 16
  bridge_num_heads: 4

train:
  lr_min_ratio: 1.0
  batch_size: 384
  num_steps: 100000
  sudoku_loss_weight: 0.0
  gradient_accumulation_steps: 2

eval:
  eval_every: 2000
  save_every: 10000
