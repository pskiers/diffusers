# @package _global_
# Painter-thinker V1 — image-conditioned thinker, sees cat(condition, noisy).
# Losses: diffusion MSE + sudoku CE.

mode: "painter"
painter_variant: "v1"

run:
  output_dir: "runs/trm_v1"

thinker:
  puzzle_emb_ndim: 0
  num_classes: 9
  halt_exploration_prob: 0.0

train:
  lr_min_ratio: 1.0
  batch_size: 384
  num_steps: 100000
  gradient_accumulation_steps: 2

eval:
  eval_every: 2000
  save_every: 10000
