# @package _global_
# Stage 2: TRM thinker (V1, IP-Adapter) with frozen CLEVR DiT.
# Per-block cross-attention injection via trainable K/V projections.
#
# Usage:
#   python train_trm.py +config_dir=configs/new \
#     experiment=clevr_thinker_v1_ip_adapter \
#     painter.checkpoint=runs/clevr_dit_painter/checkpoint_final.pt

defaults:
  - override /data: clevr
  - override /train: clevr_thinker
  - override /eval: clevr_thinker
  - override /thinker: clevr_v1
  - override /backbone: clevr_dit
  - override /vae: sdxl
  - override /condition_encoder: object_feature_v1
  - override /painter: clevr_dit_ip_adapter_frozen
  - override /loss: combined_mse
  - override /eval_callbacks: clevr
  - override /sampling: cfg
  - _self_

mode: "thinker_base"

run:
  output_dir: "runs/clevr_thinker_v1_ip_adapter"

data:
  mode: "reduced"
