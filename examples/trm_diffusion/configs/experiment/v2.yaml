# @package _global_
# Painter-thinker V2 — no sudoku CE loss, unconstrained thinker output channels.
# Thinker outputs a latent spatial map; CE loss is skipped.

mode: "painter"
painter_variant: "v2"

run:
  output_dir: "runs/trm_v2"

thinker:
  puzzle_emb_ndim: 0
  halt_exploration_prob: 0.0

painter:
  thinker_out_channels: 16

train:
  lr_min_ratio: 1.0
  batch_size: 384
  num_steps: 100000
  sudoku_loss_weight: 0.0
  gradient_accumulation_steps: 2

eval:
  eval_every: 2000
  save_every: 10000
