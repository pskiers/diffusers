# @package _global_
# Base diffusion model for ToolHang (lowdim obs), conv1d U-Net backbone.
# Usage: python train_trm.py experiment=toolhang_lowdim_unet1d_painter
defaults:
  - override /data: toolhang_lowdim
  - override /diffusion: ddpm_epsilon
  - override /backbone: toolhang_lowdim_unet1d
  - override /painter: action_unet1d
  - override /condition_encoder: lowdim_obs
  - override /train: action_lowdim
  - override /eval: action_lowdim
  - override /eval_callbacks: toolhang_lowdim
  - override /sampling: action_direct
  - _self_

mode: "painter_base"

run:
  output_dir: "runs/toolhang_lowdim_unet1d_painter"
