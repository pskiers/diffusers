# @package _global_
# Thinker with frozen pretrained painter (V1: image+noisy-conditioned encoder).
# Loads a StandalonePainter checkpoint, freezes bridge+UNet.
# Trains thinker + encoder (image_encoder, enc_proj, logit_expand, and any timestep modules).
#
# Usage:
#   python train_trm.py experiment=thinker_frozen_painter_v1 \
#     painter.painter_checkpoint=runs/standalone_painter/checkpoint_final.pt

mode: "thinker_frozen_painter"
painter_variant: "v1"

run:
  output_dir: "runs/thinker_frozen_painter_v1"

thinker:
  puzzle_emb_ndim: 0
  num_classes: 9
  optim:
    lr_min_ratio: 0.1

painter:
  painter_checkpoint: null   # REQUIRED: path to StandalonePainter checkpoint
  optim:
    lr_min_ratio: 0.1

train:
  batch_size: 384
  num_steps: 100000
  sudoku_loss_weight: 1.0
  gradient_accumulation_steps: 2

eval:
  eval_every: 2000
  save_every: 10000
  cfg_scale: 2.0