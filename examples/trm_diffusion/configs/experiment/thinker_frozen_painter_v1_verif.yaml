# @package _global_
# Thinker with frozen painter (V1) + self-verification head.
# The thinker is additionally trained to detect whether (condition, x_noisy) is consistent.
# Negative examples are generated by corrupting condition images (swapping/adding wrong digits).
#
# Usage:
#   python train_trm.py experiment=thinker_frozen_painter_v1_verif \
#     painter.painter_checkpoint=runs/standalone_painter/checkpoint_final.pt

mode: "thinker_frozen_painter"
painter_variant: "v1_verif"

run:
  output_dir: "runs/thinker_frozen_painter_v1_verif"

thinker:
  puzzle_emb_ndim: 0
  num_classes: 9
  optim:
    lr_min_ratio: 0.1

painter:
  painter_checkpoint: null   # REQUIRED: path to StandalonePainter checkpoint
  verif_weight: 0.1
  verif_max_corruptions: 5
  optim:
    lr_min_ratio: 0.1

train:
  batch_size: 384
  num_steps: 100000
  sudoku_loss_weight: 0.0
  gradient_accumulation_steps: 2

eval:
  eval_every: 2000
  save_every: 10000
  cfg_scale: 2.0