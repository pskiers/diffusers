# @package _global_
# Stage 2: TRM thinker (V1, ControlNet) with frozen CLEVR UNet.
# V1 = TRM sees object embeddings + noisy latent tokens (seq_len=74: 10+8×8).
#
# Usage:
#   python train_trm.py experiment=clevr_thinker_v1_controlnet \
#     painter.checkpoint=runs/clevr_unet_painter/checkpoint_final.pt \
#     data.clevr_root=/path/to/clevr

defaults:
  - override /data: clevr
  - override /train: clevr_thinker
  - override /eval: clevr_thinker
  - override /thinker: clevr_v1
  - override /backbone: clevr_unet
  - override /vae: sdxl
  - override /condition_encoder: object_feature_v1
  - override /painter: clevr_unet_controlnet_frozen
  - override /translator: controlnet_clevr_v1
  - override /loss: combined_mse
  - override /eval_callbacks: clevr
  - override /sampling: cfg
  - _self_

mode: "thinker_base"

run:
  output_dir: "runs/clevr_thinker_v1_controlnet"

data:
  mode: "reduced"
