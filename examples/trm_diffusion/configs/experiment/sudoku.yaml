# @package _global_
# Standalone Sudoku TRM — reproduces the original TRM README command.

mode: "sudoku"

run:
  output_dir: "runs/trm_sudoku"

thinker:
  puzzle_emb_ndim: 512
  puzzle_emb_len: 16
  halt_exploration_prob: 0.0
  optim:
    lr_min_ratio: 1.0
    warmup_steps: 2000
    puzzle_emb:
      lr: 1e-4
      weight_decay: 1.0

train:
  batch_size: 768
  num_steps: 100000