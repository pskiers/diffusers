# @package _global_
# Same as steiner_thinker_paper_controlnet.yaml, except the TRM's condition
# encoder also sees the current noisy diffusion state (x_noisy), not just
# the static terminal-points condition image — mirrors MNIST's V1 encoder
# (NoisySpatialConditionEncoder, condition_encoder/steiner_spatial_v1.yaml).
# V0 (steiner_thinker_paper_controlnet.yaml) only ever sees the static
# condition; this variant lets the TRM's reasoning be timestep/denoising-
# state-aware, at the cost of a slightly larger encoder input (2 channels
# instead of 1) and noisy_dropout_p_max=0.7 anti-exposure-bias regularization.
#
# Usage:
#   python train_trm.py experiment=steiner_thinker_paper_controlnet_v1 \
#     painter.checkpoint=runs/steiner_unet_concat_painter/checkpoint_final.pt

defaults:
  - override /data: steiner
  - override /backbone: steiner_unet_paper
  - override /painter: steiner_unet_concat_controlnet_frozen
  - override /thinker: steiner
  - override /translator: controlnet_steiner_paper
  - override /condition_encoder: steiner_spatial_v1
  - override /train: steiner_thinker
  - override /eval: steiner_thinker
  - override /loss: combined_mse
  - override /eval_callbacks: steiner_thinker
  - override /diffusion: ddim_epsilon
  - override /sampling: cfg
  - _self_

mode: "thinker_base"

run:
  output_dir: "runs/steiner_thinker_paper_controlnet_v1"

eval:
  step_timeout: 7200
